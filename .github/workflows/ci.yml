name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # 0.9.x knows the CPython 3.14 managed downloads (requires-python >= 3.14)
  UV_VERSION: "0.9.x"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check --output-format github .
      - run: uv run ruff format --check .

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/unit -v --cov --cov-report=xml
      - name: Upload coverage to Codecov
        # skip on forked PRs, where secrets (CODECOV_TOKEN) are unavailable
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  component:
    name: Component tests (PyVO vs IVOA TAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      # Run the database from the image the project ships, so the component
      # tests and the deployed tap-db can never drift apart on the server
      # major or the pgsphere build. Only the psql client comes from apt (the
      # component fixtures shell out to it to load db/init/*.sql).
      - name: Start the tap-db image
        run: |
          sudo systemctl stop postgresql || true
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          docker build -t skao-tap-ci/tap-db:ci db
          docker run -d --name tap-db-ci \
            -e POSTGRES_USER=tap -e POSTGRES_PASSWORD=tap -e POSTGRES_DB=tap \
            -p 5432:5432 skao-tap-ci/tap-db:ci
          for _ in $(seq 1 60); do
            docker exec tap-db-ci pg_isready -U tap -d tap && break
            sleep 2
          done
          docker exec tap-db-ci psql -U tap -d tap -c "ALTER USER tap WITH SUPERUSER"
          docker exec tap-db-ci psql -U tap -d tap -tAc "SELECT version()"
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/component -v --cov --cov-report=xml
        env:
          TAP_TEST_ADMIN_URL: postgresql://tap:tap@127.0.0.1:5432/postgres
      - name: Service logs
        if: failure()
        run: |
          tail -n 150 .service-logs/*.log || true
          docker logs --tail 150 tap-db-ci || true
      - name: Upload coverage to Codecov
        # skip on forked PRs, where secrets (CODECOV_TOKEN) are unavailable
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: component
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Docs build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv sync --locked --group docs
      - run: uv run --group docs mkdocs build --strict

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Chart DB init SQL matches db/init
        run: diff -ru db/init deploy/helm/skao-tap/files/db-init
      - run: helm lint deploy/helm/skao-tap
      - name: Template with defaults
        run: helm template skao-tap deploy/helm/skao-tap > /dev/null
      - name: Template with external database and ingress
        run: |
          helm template skao-tap deploy/helm/skao-tap \
            --set postgresql.enabled=false \
            --set externalDatabase.url=postgresql://tap:tap@db.example:5432/tap \
            --set ingress.enabled=true \
            --set ingress.host=tap.example.org > /dev/null

  helm-e2e:
    name: Helm chart e2e (kind)
    runs-on: ubuntu-24.04
    needs: [helm]
    steps:
      - uses: actions/checkout@v7
      - name: Build images
        run: |
          docker build -t skao-tap-e2e/tap-api:e2e -f services/tap-api/Dockerfile .
          docker build -t skao-tap-e2e/tap-executor:e2e -f services/tap-executor/Dockerfile .
          docker build -t skao-tap-e2e/tap-db:e2e db
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: skao-tap-e2e
      - name: Load images into kind
        run: |
          kind load docker-image skao-tap-e2e/tap-api:e2e --name skao-tap-e2e
          kind load docker-image skao-tap-e2e/tap-executor:e2e --name skao-tap-e2e
          kind load docker-image skao-tap-e2e/tap-db:e2e --name skao-tap-e2e
      - name: Install chart (in-chart PostgreSQL)
        run: |
          helm install skao-tap deploy/helm/skao-tap \
            --set image.registry=skao-tap-e2e \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --wait --timeout 5m
      - name: Run chart tests (availability, ADQL query, UPLOAD)
        run: helm test skao-tap --logs --timeout 5m
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/instance=skao-tap --all-containers --tail=200 || true

  images:
    name: Build image (${{ matrix.image.name }})
    runs-on: ubuntu-24.04
    needs: [lint, unit, component]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image:
          - name: tap-api
            dockerfile: services/tap-api/Dockerfile
          - name: tap-executor
            dockerfile: services/tap-executor/Dockerfile
          - name: tap-db
            dockerfile: db/Dockerfile
            context: db
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
