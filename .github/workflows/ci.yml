name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 0.9.x knows the CPython 3.14 managed downloads (requires-python >= 3.14)
  UV_VERSION: "0.9.x"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: lint
      - run: uv sync --locked --all-groups
      - run: uv run ruff check --output-format github .
      - run: uv run ruff format --check .

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: unit
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/unit -v --cov --cov-report=xml
      - name: Upload coverage to Codecov
        # skip on forked PRs, where secrets (CODECOV_TOKEN) are unavailable
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  component:
    name: Component tests (PyVO vs IVOA TAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: component
      # Run the database from the image the project ships, so the component
      # tests and the deployed tap-db can never drift apart on the server
      # major or the pgsphere build. Only the psql client comes from apt (the
      # component fixtures shell out to it to load db/init/*.sql).
      - name: Start the tap-db image
        run: |
          sudo systemctl stop postgresql || true
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          docker build -t egernia-ci/tap-db:ci db
          docker run -d --name tap-db-ci \
            -e POSTGRES_USER=tap -e POSTGRES_PASSWORD=tap -e POSTGRES_DB=tap \
            -p 5432:5432 egernia-ci/tap-db:ci
          for _ in $(seq 1 60); do
            docker exec tap-db-ci pg_isready -U tap -d tap && break
            sleep 2
          done
          # fail here, with the server's own logs, rather than further down
          # with a confusing psql connection error
          if ! docker exec tap-db-ci pg_isready -U tap -d tap; then
            echo "::error::tap-db did not become ready within 120s"
            docker logs --tail 100 tap-db-ci
            exit 1
          fi
          docker exec tap-db-ci psql -U tap -d tap -c "ALTER USER tap WITH SUPERUSER"
          docker exec tap-db-ci psql -U tap -d tap -tAc "SELECT version()"
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/component -v --cov --cov-report=xml
        env:
          TAP_TEST_ADMIN_URL: postgresql://tap:tap@127.0.0.1:5432/postgres
      - name: Service logs
        if: failure()
        run: |
          tail -n 150 .service-logs/*.log || true
          docker logs --tail 150 tap-db-ci || true
      - name: Upload coverage to Codecov
        # skip on forked PRs, where secrets (CODECOV_TOKEN) are unavailable
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: component
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Docs build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: docs
      - run: uv sync --locked --group docs
      - run: uv run --group docs mkdocs build --strict

  benchmark-harness:
    name: Benchmark harness
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: benchmark
      - run: uv sync --locked --group benchmark
      # The harness's own claims: determinism, statistics, the bottleneck rules
      # and timings that are absent rather than guessed. No cluster involved —
      # a benchmark whose harness is wrong produces confident numbers about
      # nothing, and that failure is silent in the results.
      - run: uv run pytest benchmarks/egernia-performance/tests -q

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Chart DB init SQL matches db/init
        run: diff -ru db/init etc/helm/files/db-init
      - run: helm lint etc/helm
      - name: Template with defaults
        run: helm template egernia etc/helm > /dev/null
      - name: Template with external database and ingress
        run: |
          helm template egernia etc/helm \
            --set postgresql.enabled=false \
            --set externalDatabase.url=postgresql://tap:tap@db.example:5432/tap \
            --set ingress.enabled=true \
            --set ingress.host=tap.example.org > /dev/null
      - name: Template with scaling, VPA, backup and PG tuning
        run: |
          helm template egernia etc/helm \
            --set tapApi.replicas=3 \
            --set tapExecutor.replicas=2 \
            --set results.accessModes={ReadWriteMany} \
            --set verticalAutoscaling.enabled=true \
            --set backup.enabled=true \
            --set postgresql.tuning.shared_buffers=512MB \
            --set postgresql.tuning.max_connections=100 \
            | grep -qE "kind: (PodDisruptionBudget|VerticalPodAutoscaler|CronJob)"
      - name: Template with several API workers
        run: |
          helm template egernia etc/helm \
            --set tapApi.workers=4 --set tapApi.port=9090 \
            | grep -q 'TAP_API_WORKERS: "4"'
          # the port the deployment declares has to be the port the app uses
          helm template egernia etc/helm --set tapApi.port=9090 \
            | grep -q 'TAP_API_PORT: "9090"'
          # and rendering those values is only useful if the pod reads them:
          # without this the ConfigMap could stop being consumed and the greps
          # above would still pass
          helm template egernia etc/helm \
            --show-only templates/api-deployment.yaml \
            | grep -A2 'envFrom:' | grep -q 'configMapRef'
      - name: Template with the metrics stack
        run: |
          # annotations on by default, so an existing Prometheus finds the pods
          helm template egernia etc/helm \
            | grep -q 'prometheus.io/scrape: "true"'
          # the chart scrapes nothing itself: the deployment stack runs the
          # Prometheus, and two scrapers on one set of endpoints is one too many
          helm template egernia etc/helm \
            | grep -q 'app.kubernetes.io/component: prometheus' \
            && { echo "::error::the chart rendered a Prometheus of its own"; exit 1; }
          helm template egernia etc/helm \
            --set tracing.otlpEndpoint=http://collector:4317 \
            | grep -q 'OTEL_EXPORTER_OTLP_ENDPOINT: "http://collector:4317"'
      - name: Template with horizontal autoscaling
        run: |
          # nothing rendered, and the deployments keep their own replica count
          helm template egernia etc/helm \
            | grep -qE "kind: (HorizontalPodAutoscaler|ScaledObject)" \
            && { echo "::error::an autoscaler rendered by default"; exit 1; }
          helm template egernia etc/helm \
            --set horizontalAutoscaling.tapApi.enabled=true \
            | grep -q "kind: HorizontalPodAutoscaler"
          # while an autoscaler owns the count, the chart must not send one:
          # a helm upgrade would reset what the autoscaler had chosen
          test "$(helm template egernia etc/helm \
            --set horizontalAutoscaling.tapApi.enabled=true \
            --show-only templates/api-deployment.yaml | grep -c 'replicas:')" = 0
          # the PDB follows minReplicas, which is the floor a drain sees
          helm template egernia etc/helm \
            --set horizontalAutoscaling.tapApi.enabled=true \
            --show-only templates/pdb.yaml | grep -q "kind: PodDisruptionBudget"
          # KEDA by default, with max() rather than sum(): every replica
          # reports the same shared queue, so sum() would scale on the replica
          # count and then feed on its own output
          helm template egernia etc/helm \
            --set horizontalAutoscaling.tapExecutor.enabled=true \
            --set horizontalAutoscaling.tapExecutor.prometheusAddress=http://prometheus.monitoring:9090 \
            | grep -q 'query: "max(tap_jobs{phase=\\"QUEUED\\",namespace=\\"default\\"})"'
          helm template egernia etc/helm \
            --set horizontalAutoscaling.tapExecutor.enabled=true \
            --set horizontalAutoscaling.tapExecutor.prometheusAddress=http://prometheus.monitoring:9090 | grep -q "kind: ScaledObject"
          # and a plain HPA for a cluster that already serves external metrics
          helm template egernia etc/helm \
            --set horizontalAutoscaling.tapExecutor.enabled=true \
            --set horizontalAutoscaling.tapExecutor.scaler=external \
            --show-only templates/hpa.yaml \
            | grep -q "type: External"
          # that path is scoped by a label selector, not by `query`, so a
          # provider publishing no labels has to be able to remove it: a
          # selector matching no series is a dead autoscaler, not a strict one
          test "$(helm template egernia etc/helm \
            --set horizontalAutoscaling.tapExecutor.enabled=true \
            --set horizontalAutoscaling.tapExecutor.scaler=external \
            --set-json 'horizontalAutoscaling.tapExecutor.externalMetricSelector={}' \
            --show-only templates/hpa.yaml | grep -c 'matchLabels')" = 0
          helm template egernia etc/helm \
            --set horizontalAutoscaling.tapExecutor.enabled=true \
            --set horizontalAutoscaling.tapExecutor.scaler=external \
            --set-json 'horizontalAutoscaling.tapExecutor.externalMetricSelector={"job":"tap-executor"}' \
            --show-only templates/hpa.yaml | grep -q 'job: tap-executor'
          # the annotation says what the provider must publish, so it has to
          # follow the selector: claiming a namespace match that the HPA is
          # not asking for sends whoever debugs this to the wrong place
          helm template egernia etc/helm \
            --set horizontalAutoscaling.tapExecutor.enabled=true \
            --set horizontalAutoscaling.tapExecutor.scaler=external \
            --set-json 'horizontalAutoscaling.tapExecutor.externalMetricSelector={}' \
            --show-only templates/hpa.yaml \
            | grep -q 'expected-query: "max(tap_jobs_queued)"'
          helm template egernia etc/helm \
            --set horizontalAutoscaling.tapExecutor.enabled=true \
            --set horizontalAutoscaling.tapExecutor.scaler=external \
            --set horizontalAutoscaling.tapExecutor.externalMetricName=tap_backlog \
            --show-only templates/hpa.yaml \
            | grep -q 'expected-query: "max(tap_backlog{namespace=' 
          # scale-to-zero is refused for the default query and allowed for one
          # that survives having no executors — and the activation threshold
          # is rendered only where it can do anything
          helm template egernia etc/helm \
            --set horizontalAutoscaling.tapExecutor.enabled=true \
            --set horizontalAutoscaling.tapExecutor.minReplicas=0 \
            --set horizontalAutoscaling.tapExecutor.prometheusAddress=http://prometheus.monitoring:9090 \
            --set 'horizontalAutoscaling.tapExecutor.query=max(from_the_database)' \
            --show-only templates/hpa.yaml | grep -q "activationThreshold"
          test "$(helm template egernia etc/helm \
            --set horizontalAutoscaling.tapExecutor.enabled=true \
            --set horizontalAutoscaling.tapExecutor.prometheusAddress=http://prometheus.monitoring:9090 \
            --show-only templates/hpa.yaml | grep -c activationThreshold)" = 0
          # a live VPA sizing memory beside a CPU HPA is supported: one
          # controller per resource, which is the pattern that is not
          helm template egernia etc/helm \
            --set horizontalAutoscaling.tapApi.enabled=true \
            --set verticalAutoscaling.enabled=true \
            --set verticalAutoscaling.updateMode=Auto \
            --set-json 'verticalAutoscaling.controlledResources=["memory"]' \
            --show-only templates/vpa.yaml | grep -q '\["memory"\]'
      # Every one of these is an autoscaler that would look configured and
      # either do nothing or make things worse.
      - name: Unworkable autoscaling configurations are refused
        run: |
          refuses() {
            if helm template egernia etc/helm "$@" >/dev/null 2>&1; then
              echo "::error::chart rendered an unworkable autoscaling config: $*"
              exit 1
            fi
          }
          api=(--set horizontalAutoscaling.tapApi.enabled=true)
          executor=(--set horizontalAutoscaling.tapExecutor.enabled=true
                    --set horizontalAutoscaling.tapExecutor.prometheusAddress=http://prometheus.monitoring:9090)
          # a CPU utilisation target is a percentage of the request
          refuses "${api[@]}" --set tapApi.resources=null
          # the VPA resizes the pod the HPA is measuring a percentage of
          refuses "${api[@]}" --set verticalAutoscaling.enabled=true \
                  --set verticalAutoscaling.updateMode=Auto
          refuses "${api[@]}" --set horizontalAutoscaling.tapApi.maxReplicas=1
          refuses "${api[@]}" --set horizontalAutoscaling.tapApi.minReplicas=0
          # the default query reads a gauge the executor itself exports: at
          # zero replicas nothing reports the queue that would start one
          refuses "${executor[@]}" --set horizontalAutoscaling.tapExecutor.minReplicas=0
          # and a plain HPA cannot reach zero at all, own query or not
          refuses "${executor[@]}" --set horizontalAutoscaling.tapExecutor.minReplicas=0 \
                  --set horizontalAutoscaling.tapExecutor.scaler=external \
                  --set 'horizontalAutoscaling.tapExecutor.query=max(from_the_database)'
          refuses "${executor[@]}" --set horizontalAutoscaling.tapExecutor.scaler=cron
          refuses "${executor[@]}" \
                  --set horizontalAutoscaling.tapExecutor.queuedJobsPerReplica=0
          # the renamed seconds-denominated knobs are refused by name, so a
          # value silently read in the wrong unit cannot scale wrongly
          refuses "${executor[@]}" \
                  --set horizontalAutoscaling.tapExecutor.backlogSecondsPerReplica=60
          refuses "${executor[@]}" \
                  --set horizontalAutoscaling.tapExecutor.activationBacklogSeconds=5
          # KEDA has to be told which Prometheus has the metric
          refuses --set horizontalAutoscaling.tapExecutor.enabled=true
          # scaled out, the pools would exceed the server's max_connections
          refuses "${api[@]}" --set tapApi.workers=4 \
                  --set postgresql.tuning.max_connections=100
          # and the same numbers under the limit still render
          helm template egernia etc/helm "${api[@]}" \
            --set tapApi.workers=4 --set postgresql.tuning.max_connections=250 \
            >/dev/null
          # recommendation-only VPA alongside a CPU HPA is supported and useful
          helm template egernia etc/helm "${api[@]}" \
            --set verticalAutoscaling.enabled=true >/dev/null
      - name: Template with authentication enabled
        run: |
          helm template egernia etc/helm \
            --set auth.enabled=true \
            --set auth.iam.issuer=https://ska-iam.stfc.ac.uk \
            --set auth.iam.audience=science-metadata \
            --set 'auth.roles.metadata\.delete.groups={/ska/oper}' \
            | grep -q 'TAP_AUTH_ROLES'
          helm template egernia etc/helm \
            --set auth.enabled=true \
            --set auth.plugin=permissions-api \
            --set auth.iam.issuer=https://ska-iam.stfc.ac.uk \
            --set auth.iam.audience=science-metadata \
            --set auth.permissionsApi.url=https://permissions.srcnet.skao.int/api/v1 \
            | grep -q 'TAP_PERMISSIONS_API_URL'
      - name: Template serving anonymous VO clients
        run: |
          helm template egernia etc/helm \
            --set auth.enabled=true \
            --set auth.anonymousQueries=true \
            --set auth.iam.issuer=https://ska-iam.stfc.ac.uk \
            --set auth.iam.audience=science-metadata \
            --set 'auth.roles.metadata\.delete.groups={/ska/oper}' \
            | grep -q 'TAP_AUTH_ANONYMOUS_QUERIES: "true"'
      - name: Template with the token requirement relaxed
        run: |
          helm template egernia etc/helm \
            --set auth.enabled=true \
            --set auth.requireToken=false \
            --set auth.iam.issuer=https://ska-iam.stfc.ac.uk \
            --set auth.iam.audience=science-metadata \
            --set 'auth.roles.metadata\.delete.groups={/ska/oper}' \
            | grep -q 'TAP_AUTH_REQUIRE_TOKEN: "false"'
      - name: Template with querying gated as well
        run: |
          helm template egernia etc/helm \
            --set auth.enabled=true \
            --set auth.iam.issuer=https://ska-iam.stfc.ac.uk \
            --set auth.iam.audience=science-metadata \
            --set 'auth.gatedOperations={jobs.create,jobs.mutate,jobs.delete,query.sync}' \
            --set 'auth.roles.jobs\.create.groups={/ska/oper}' \
            --set 'auth.roles.jobs\.mutate.groups={/ska/oper}' \
            --set 'auth.roles.jobs\.delete.groups={/ska/oper}' \
            --set 'auth.roles.query\.sync.anyVerifiedToken=true' \
            | grep -q 'TAP_AUTH_GATED_OPERATIONS: "jobs.create,jobs.mutate,jobs.delete,query.sync"'
          helm template egernia etc/helm \
            --set auth.enabled=true \
            --set auth.iam.issuer=https://ska-iam.stfc.ac.uk \
            --set auth.iam.audience=science-metadata \
            --set 'auth.gatedOperations={none}' \
            --set 'auth.roles.metadata\.delete.groups={/ska/oper}' \
            | grep -q 'TAP_AUTH_GATED_OPERATIONS: "none"'
      - name: Template with the VOResource record enabled
        run: |
          helm template egernia etc/helm \
            --set voRegistry.enabled=true \
            --set voRegistry.authorityId=skao.int \
            --set voRegistry.resourceKey=srcnet/tap \
            --set voRegistry.title="SKAO SRCNet TAP service" \
            --set voRegistry.shortName="SKAO TAP" \
            --set voRegistry.description="Science metadata" \
            --set voRegistry.referenceUrl=https://srcnet.example.org/tap \
            --set voRegistry.publisher="SKA Observatory" \
            --set voRegistry.created=2026-08-23 \
            --set 'voRegistry.subjects={radio astronomy}' \
            | grep -q 'TAP_REGISTRY_IDENTIFIER: "ivo://skao.int/srcnet/tap"'
      # A record a publishing registry would reject must fail at deploy time.
      - name: Incomplete VOResource configurations are refused
        run: |
          refuses() {
            if helm template egernia etc/helm "$@" >/dev/null 2>&1; then
              echo "::error::chart rendered an incomplete VOResource config: $*"
              exit 1
            fi
          }
          complete=(--set voRegistry.enabled=true
                    --set voRegistry.authorityId=skao.int
                    --set voRegistry.resourceKey=srcnet/tap
                    --set voRegistry.title=T --set voRegistry.shortName=S
                    --set voRegistry.description=D
                    --set voRegistry.referenceUrl=https://example.org
                    --set voRegistry.publisher=P
                    --set voRegistry.created=2026-08-23)
          refuses "${complete[@]}"                                        # no subjects
          refuses "${complete[@]}" --set 'voRegistry.subjects={radio}' \
                  --set voRegistry.authorityId=""                         # no authority
          refuses "${complete[@]}" --set 'voRegistry.subjects={radio}' \
                  --set voRegistry.shortName="a-very-long-short-name"     # over 16 chars
          # whitespace is not a value: these would pass a nil/empty check and
          # then fail at runtime, which is what this validation exists to stop
          refuses "${complete[@]}" --set 'voRegistry.subjects={radio}' \
                  --set voRegistry.title="   "
          refuses "${complete[@]}" --set-json 'voRegistry.subjects=[" "]'
          # padding is trimmed on the way out, so it cannot reach the identifier
          helm template egernia etc/helm "${complete[@]}" \
            --set 'voRegistry.subjects={radio}' \
            --set voRegistry.authorityId="skao.int " \
            | grep -q 'TAP_REGISTRY_IDENTIFIER: "ivo://skao.int/srcnet/tap"'

      # Each of these is a way to end up with auth "on" but nothing enforced.
      - name: Unsafe authentication configurations are refused
        run: |
          refuses() {
            if helm template egernia etc/helm "$@" >/dev/null 2>&1; then
              echo "::error::chart rendered an unsafe auth config: $*"
              exit 1
            fi
          }
          refuses --set auth.enabled=true
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata
          # an operation enforced but granted to nobody, and an unknown one
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata \
                  --set 'auth.gatedOperations={jobs.create,jobs.mutate,jobs.delete,query.sync}' \
                  --set 'auth.roles.metadata\.delete.groups={/ska/oper}'
          # part of the query surface only: the caller refused at /tap/async
          # would run the same query at /tap/sync
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata \
                  --set 'auth.gatedOperations={jobs.create}' \
                  --set 'auth.roles.jobs\.create.groups={/ska/oper}'
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata \
                  --set 'auth.gatedOperations={jobs.rename}' \
                  --set 'auth.roles.jobs\.rename.groups={/ska/oper}'
          # a rule that exists but grants nobody: same outcome as no rule,
          # by a longer route
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata \
                  --set 'auth.gatedOperations={metadata.delete}' \
                  --set-json 'auth.roles={"metadata.delete":{}}'
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata \
                  --set 'auth.gatedOperations={metadata.delete}' \
                  --set 'auth.roles.metadata\.delete.groups={}'
          # "none" is only "enforce nothing" on its own
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata \
                  --set 'auth.gatedOperations={none,jobs.create}' \
                  --set 'auth.roles.jobs\.create.groups={/ska/oper}'

  helm-e2e:
    name: Helm chart e2e (kind)
    runs-on: ubuntu-24.04
    needs: [helm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build -t egernia-e2e/tap-api:e2e -f services/egernia-api/Dockerfile .
          docker build -t egernia-e2e/tap-executor:e2e -f services/egernia-executor/Dockerfile .
          docker build -t egernia-e2e/tap-db:e2e db
      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: egernia-e2e
      - name: Load images into kind
        run: |
          kind load docker-image egernia-e2e/tap-api:e2e --name egernia-e2e
          kind load docker-image egernia-e2e/tap-executor:e2e --name egernia-e2e
          kind load docker-image egernia-e2e/tap-db:e2e --name egernia-e2e
      - name: Install chart (in-chart PostgreSQL)
        run: |
          helm install egernia etc/helm \
            --set image.registry=egernia-e2e \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --set horizontalAutoscaling.tapApi.enabled=true \
            --set horizontalAutoscaling.tapApi.minReplicas=1 \
            --wait --timeout 5m
      - name: Run chart tests (availability, ADQL query, UPLOAD)
        run: helm test egernia --logs --timeout 5m
      # `helm template` only proves the YAML renders. This is the API server
      # accepting it, and the HPA finding the Deployment it names — a wrong
      # scaleTargetRef renders perfectly and scales nothing.
      - name: The autoscaler attached to the deployment
        run: |
          kubectl get hpa egernia-tap-api -o jsonpath='{.spec.scaleTargetRef.name}' \
            | grep -qx egernia-tap-api
          kubectl wait --for=jsonpath='{.status.currentReplicas}'=1 \
            hpa/egernia-tap-api --timeout=2m
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/instance=egernia --all-containers --tail=200 || true

  images:
    name: Build image (${{ matrix.image.name }})
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    needs: [lint, unit, component]
    permissions:
      contents: read
    strategy:
      matrix:
        image:
          - name: tap-api
            dockerfile: services/egernia-api/Dockerfile
          - name: tap-executor
            dockerfile: services/egernia-executor/Dockerfile
          - name: tap-db
            dockerfile: db/Dockerfile
            context: db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          push: false
          tags: egernia-ci/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-images:
    name: Publish and attest image (${{ matrix.image.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [lint, unit, component]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image:
          - name: tap-api
            dockerfile: services/egernia-api/Dockerfile
          - name: tap-executor
            dockerfile: services/egernia-executor/Dockerfile
          - name: tap-db
            dockerfile: db/Dockerfile
            context: db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          format: spdx-json
          output-file: "${{ runner.temp }}/${{ matrix.image.name }}.spdx.json"
          artifact-name: "${{ matrix.image.name }}-sbom.spdx.json"
          upload-artifact: true
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: "${{ runner.temp }}/${{ matrix.image.name }}.spdx.json"
          push-to-registry: true
