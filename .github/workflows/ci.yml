name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # 0.9.x knows the CPython 3.14 managed downloads (requires-python >= 3.14)
  UV_VERSION: "0.9.x"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: lint
      - run: uv sync --locked --all-groups
      - run: uv run ruff check --output-format github .
      - run: uv run ruff format --check .

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: unit
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/unit -v --cov --cov-report=xml
      - name: Upload coverage to Codecov
        # skip on forked PRs, where secrets (CODECOV_TOKEN) are unavailable
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  component:
    name: Component tests (PyVO vs IVOA TAP)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: component
      # Run the database from the image the project ships, so the component
      # tests and the deployed tap-db can never drift apart on the server
      # major or the pgsphere build. Only the psql client comes from apt (the
      # component fixtures shell out to it to load db/init/*.sql).
      - name: Start the tap-db image
        run: |
          sudo systemctl stop postgresql || true
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          docker build -t skao-tap-ci/tap-db:ci db
          docker run -d --name tap-db-ci \
            -e POSTGRES_USER=tap -e POSTGRES_PASSWORD=tap -e POSTGRES_DB=tap \
            -p 5432:5432 skao-tap-ci/tap-db:ci
          for _ in $(seq 1 60); do
            docker exec tap-db-ci pg_isready -U tap -d tap && break
            sleep 2
          done
          # fail here, with the server's own logs, rather than further down
          # with a confusing psql connection error
          if ! docker exec tap-db-ci pg_isready -U tap -d tap; then
            echo "::error::tap-db did not become ready within 120s"
            docker logs --tail 100 tap-db-ci
            exit 1
          fi
          docker exec tap-db-ci psql -U tap -d tap -c "ALTER USER tap WITH SUPERUSER"
          docker exec tap-db-ci psql -U tap -d tap -tAc "SELECT version()"
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests/component -v --cov --cov-report=xml
        env:
          TAP_TEST_ADMIN_URL: postgresql://tap:tap@127.0.0.1:5432/postgres
      - name: Service logs
        if: failure()
        run: |
          tail -n 150 .service-logs/*.log || true
          docker logs --tail 150 tap-db-ci || true
      - name: Upload coverage to Codecov
        # skip on forked PRs, where secrets (CODECOV_TOKEN) are unavailable
        if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage.xml
          flags: component
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  docs:
    name: Docs build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: docs
      - run: uv sync --locked --group docs
      - run: uv run --group docs mkdocs build --strict

  helm:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Chart DB init SQL matches db/init
        run: diff -ru db/init deploy/helm/skao-tap/files/db-init
      - run: helm lint deploy/helm/skao-tap
      - name: Template with defaults
        run: helm template skao-tap deploy/helm/skao-tap > /dev/null
      - name: Template with external database and ingress
        run: |
          helm template skao-tap deploy/helm/skao-tap \
            --set postgresql.enabled=false \
            --set externalDatabase.url=postgresql://tap:tap@db.example:5432/tap \
            --set ingress.enabled=true \
            --set ingress.host=tap.example.org > /dev/null
      - name: Template with scaling, VPA, backup and PG tuning
        run: |
          helm template skao-tap deploy/helm/skao-tap \
            --set tapApi.replicas=3 \
            --set tapExecutor.replicas=2 \
            --set results.accessModes={ReadWriteMany} \
            --set verticalAutoscaling.enabled=true \
            --set backup.enabled=true \
            --set postgresql.tuning.shared_buffers=512MB \
            --set postgresql.tuning.max_connections=100 \
            | grep -qE "kind: (PodDisruptionBudget|VerticalPodAutoscaler|CronJob)"
      - name: Template with authentication enabled
        run: |
          helm template skao-tap deploy/helm/skao-tap \
            --set auth.enabled=true \
            --set auth.iam.issuer=https://ska-iam.stfc.ac.uk \
            --set auth.iam.audience=science-metadata \
            --set 'auth.roles.metadata\.delete.groups={/ska/oper}' \
            | grep -q 'TAP_AUTH_ROLES'
          helm template skao-tap deploy/helm/skao-tap \
            --set auth.enabled=true \
            --set auth.plugin=permissions-api \
            --set auth.iam.issuer=https://ska-iam.stfc.ac.uk \
            --set auth.iam.audience=science-metadata \
            --set auth.permissionsApi.url=https://permissions.srcnet.skao.int/api/v1 \
            | grep -q 'TAP_PERMISSIONS_API_URL'
      - name: Template with querying gated as well
        run: |
          helm template skao-tap deploy/helm/skao-tap \
            --set auth.enabled=true \
            --set auth.iam.issuer=https://ska-iam.stfc.ac.uk \
            --set auth.iam.audience=science-metadata \
            --set 'auth.gatedOperations={jobs.create,jobs.mutate,jobs.delete,query.sync}' \
            --set 'auth.roles.jobs\.create.groups={/ska/oper}' \
            --set 'auth.roles.jobs\.mutate.groups={/ska/oper}' \
            --set 'auth.roles.jobs\.delete.groups={/ska/oper}' \
            --set 'auth.roles.query\.sync.anyVerifiedToken=true' \
            | grep -q 'TAP_AUTH_GATED_OPERATIONS: "jobs.create,jobs.mutate,jobs.delete,query.sync"'
          helm template skao-tap deploy/helm/skao-tap \
            --set auth.enabled=true \
            --set auth.iam.issuer=https://ska-iam.stfc.ac.uk \
            --set auth.iam.audience=science-metadata \
            --set 'auth.gatedOperations={none}' \
            --set 'auth.roles.metadata\.delete.groups={/ska/oper}' \
            | grep -q 'TAP_AUTH_GATED_OPERATIONS: "none"'
      # Each of these is a way to end up with auth "on" but nothing enforced.
      - name: Unsafe authentication configurations are refused
        run: |
          refuses() {
            if helm template skao-tap deploy/helm/skao-tap "$@" >/dev/null 2>&1; then
              echo "::error::chart rendered an unsafe auth config: $*"
              exit 1
            fi
          }
          refuses --set auth.enabled=true
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata
          # an operation enforced but granted to nobody, and an unknown one
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata \
                  --set 'auth.gatedOperations={jobs.create,jobs.mutate,jobs.delete,query.sync}' \
                  --set 'auth.roles.metadata\.delete.groups={/ska/oper}'
          # part of the query surface only: the caller refused at /tap/async
          # would run the same query at /tap/sync
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata \
                  --set 'auth.gatedOperations={jobs.create}' \
                  --set 'auth.roles.jobs\.create.groups={/ska/oper}'
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata \
                  --set 'auth.gatedOperations={jobs.rename}' \
                  --set 'auth.roles.jobs\.rename.groups={/ska/oper}'
          # a rule that exists but grants nobody: same outcome as no rule,
          # by a longer route
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata \
                  --set 'auth.gatedOperations={metadata.delete}' \
                  --set-json 'auth.roles={"metadata.delete":{}}'
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata \
                  --set 'auth.gatedOperations={metadata.delete}' \
                  --set 'auth.roles.metadata\.delete.groups={}'
          # "none" is only "enforce nothing" on its own
          refuses --set auth.enabled=true --set auth.iam.issuer=https://iam.example \
                  --set auth.iam.audience=science-metadata \
                  --set 'auth.gatedOperations={none,jobs.create}' \
                  --set 'auth.roles.jobs\.create.groups={/ska/oper}'

  helm-e2e:
    name: Helm chart e2e (kind)
    runs-on: ubuntu-24.04
    needs: [helm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build images
        run: |
          docker build -t skao-tap-e2e/tap-api:e2e -f services/tap-api/Dockerfile .
          docker build -t skao-tap-e2e/tap-executor:e2e -f services/tap-executor/Dockerfile .
          docker build -t skao-tap-e2e/tap-db:e2e db
      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: skao-tap-e2e
      - name: Load images into kind
        run: |
          kind load docker-image skao-tap-e2e/tap-api:e2e --name skao-tap-e2e
          kind load docker-image skao-tap-e2e/tap-executor:e2e --name skao-tap-e2e
          kind load docker-image skao-tap-e2e/tap-db:e2e --name skao-tap-e2e
      - name: Install chart (in-chart PostgreSQL)
        run: |
          helm install skao-tap deploy/helm/skao-tap \
            --set image.registry=skao-tap-e2e \
            --set image.tag=e2e \
            --set image.pullPolicy=Never \
            --wait --timeout 5m
      - name: Run chart tests (availability, ADQL query, UPLOAD)
        run: helm test skao-tap --logs --timeout 5m
      - name: Diagnostics
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl describe pods
          kubectl logs -l app.kubernetes.io/instance=skao-tap --all-containers --tail=200 || true

  images:
    name: Build image (${{ matrix.image.name }})
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    needs: [lint, unit, component]
    permissions:
      contents: read
    strategy:
      matrix:
        image:
          - name: tap-api
            dockerfile: services/tap-api/Dockerfile
          - name: tap-executor
            dockerfile: services/tap-executor/Dockerfile
          - name: tap-db
            dockerfile: db/Dockerfile
            context: db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          push: false
          tags: skao-tap-ci/${{ matrix.image.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-images:
    name: Publish and attest image (${{ matrix.image.name }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [lint, unit, component]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        image:
          - name: tap-api
            dockerfile: services/tap-api/Dockerfile
          - name: tap-executor
            dockerfile: services/tap-executor/Dockerfile
          - name: tap-db
            dockerfile: db/Dockerfile
            context: db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Compute image name
        id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image.name }}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.image.context || '.' }}
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: "${{ steps.meta.outputs.image }}@${{ steps.build.outputs.digest }}"
          format: spdx-json
          output-file: "${{ runner.temp }}/${{ matrix.image.name }}.spdx.json"
          artifact-name: "${{ matrix.image.name }}-sbom.spdx.json"
          upload-artifact: true
          upload-release-assets: false
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: "${{ runner.temp }}/${{ matrix.image.name }}.spdx.json"
          push-to-registry: true
