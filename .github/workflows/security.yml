name: Security

# Code scanning integrations run automatically while this repository is public.
# The ENABLE_GHAS gate preserves the same behaviour if it later becomes private:
# set ENABLE_GHAS=true after enabling GitHub Advanced Security. pip-audit and the
# Trivy scan itself run regardless.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"  # weekly, Monday morning UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (Python)
    if: ${{ !github.event.repository.private || vars.ENABLE_GHAS == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-python

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' && (!github.event.repository.private || vars.ENABLE_GHAS == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  zizmor:
    name: zizmor (GitHub Actions)
    if: ${{ !github.event.repository.private || vars.ENABLE_GHAS == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  pip-audit:
    name: pip-audit (known vulnerabilities)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # match requires-python: the lock only carries hashes for wheels
      # relevant to >=3.14, so pip-audit must resolve under 3.14 too
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Export locked requirements
        # git-pinned packages are excluded: pip-audit's hash-checked dry-run
        # cannot resolve them (their own deps stay in the export)
        run: uv export --frozen --no-dev --no-emit-project --no-emit-workspace --no-emit-package ska-src-mm-notification --no-emit-package ska-src-sdm -o requirements.txt
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt

  trivy:
    name: Trivy scan (vuln, secrets, misconfig)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Scan (results in job log; fails on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Scan to SARIF
        if: ${{ always() && (!github.event.repository.private || vars.ENABLE_GHAS == 'true') }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
      - name: Upload SARIF to code scanning
        if: ${{ always() && (!github.event.repository.private || vars.ENABLE_GHAS == 'true') }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-fs
