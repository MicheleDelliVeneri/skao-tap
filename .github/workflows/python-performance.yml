name: Python performance

on:
  push:
    branches: [main]
    paths:
      - "libs/egernia-core/**"
      - "services/**"
      - "tests/benchmarks/**"
      - ".github/workflows/python-performance.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "libs/egernia-core/**"
      - "services/**"
      - "tests/benchmarks/**"
      - ".github/workflows/python-performance.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-performance-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Hot-path benchmarks and profiles
    runs-on: ubuntu-24.04
    # The suite is seconds of work. A ceiling turns a pathological profiler
    # into a failure instead of an expense: the whole-request benchmarks once
    # took this job from 37 seconds to 2h29m and it still reported success, so
    # nothing said anything was wrong.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # py-spy attaches to the running interpreter, so this job profiles a
      # CPython from setup-python rather than a uv-managed one.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.9.x"
          enable-cache: true
          cache-suffix: benchmarks
      - name: Install project and profiling tools
        run: |
          uv sync --locked --all-groups --python "$(command -v python)"
          uv pip install --python .venv/bin/python \
            pytest-benchmark==5.2.3 py-spy==0.4.2
      - name: Measure hot paths
        run: |
          mkdir -p performance-results
          uv run --no-sync pytest tests/benchmarks -v \
            --benchmark-json=performance-results/benchmarks.json
      - name: Record Python flamegraph
        run: |
          svg=performance-results/python-hot-paths-flamegraph.svg
          # --nonblocking is not optional here. py-spy's default pauses the
          # process to walk its stacks, which is cheap on the function-level
          # benchmarks and pathological once the suite drives an ASGI app with
          # an event loop and a threadpool: measured at 2h29m against 15s, for
          # 19s of actual benchmarking. The same mode costs a saturated
          # tap-api worker 74% of its throughput (measured by the profile family of
          # the since-removed cluster benchmark harness), so this is the same finding
          # arriving in CI.
          #
          # What it costs is torn stacks — py-spy discards the reads it detects
          # as inconsistent, about half of them here, leaving a few hundred
          # samples. That is thin for shares and adequate for this artefact's
          # purpose, which is spotting the widest frames by eye. Precise
          # attribution comes from the cluster profile, which samples one
          # worker for ten minutes.
          #
          # py-spy sometimes exits non-zero *after* writing its output, having
          # lost the race to reap a short-lived child ("No child process").
          # The evidence is the flamegraph, so judge the step by whether the
          # flamegraph exists rather than by py-spy's exit code.
          status=0
          .venv/bin/py-spy record \
            --output "$svg" \
            --format flamegraph --rate 100 --nonblocking \
            -- .venv/bin/python -m pytest tests/benchmarks -q --benchmark-only || status=$?
          if [ ! -s "$svg" ]; then
            echo "::error::py-spy exited $status and produced no flamegraph"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::py-spy exited $status after writing $svg; keeping the profile"
          fi
      - name: Upload profiling evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-performance-${{ github.run_id }}
          path: performance-results/
          if-no-files-found: error
          retention-days: 30
