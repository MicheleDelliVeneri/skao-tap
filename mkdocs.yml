site_name: egernia
site_description: IVOA TAP 1.1 server in Python — microservices on PostgreSQL
repo_url: https://github.com/MicheleDelliVeneri/egernia
theme:
  name: material
  # The mark is the single source in assets/; Material resolves theme paths
  # against docs_dir, so the docs copy is the one it can actually serve.
  logo: assets/egernia-mark.svg
  favicon: assets/egernia-mark.svg
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - content.code.copy
hooks:
  - scripts/generate_model_schema_docs.py
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  # Mermaid diagrams are rendered client-side by Material's own bundled
  # mermaid, so the architecture diagrams stay diffable text in git rather
  # than binary images that go stale silently.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: index.md
  - Quickstart: quickstart.md
  - Architecture: architecture.md
  - API reference: api.md
  - JSON API: json-api.md
  - Result formats: result-formats.md
  - Metadata plugins: plugins.md
  - ObsCore: obscore.md
  - Generated model schemas: model-schemas.md
  - Deployment: deployment.md
  - Development: development.md
  - Authentication: auth.md
  - VO Registry: registry.md
  - Observability: observability.md
  - Autoscaling: autoscaling.md
  - Benchmarking: benchmarking.md
  - Performance:
    - Results: performance/index.md
    - PostgreSQL and TAP load testing: postgres-performance.md
    - Python profiling: python-performance.md
  - Roadmap: roadmap.md
