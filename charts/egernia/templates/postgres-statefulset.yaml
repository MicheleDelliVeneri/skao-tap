{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "egernia.fullname" . }}-postgres
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "egernia.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "egernia.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "egernia.labels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      securityContext:
        {{- toYaml .Values.postgresqlSecurityContext.pod | nindent 8 }}
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image | default (printf "%s/tap-db:%s" .Values.image.registry (include "egernia.imageTag" .)) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.postgresqlSecurityContext.container | nindent 12 }}
          {{- /* server tuning: each entry becomes a -c key=value argument */}}
          {{- with .Values.postgresql.tuning }}
          {{- $tuning := . }}
          args:
            {{- range $key := (keys $tuning | sortAlpha) }}
            - "-c"
            - {{ printf "%s=%v" $key (index $tuning $key) | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: {{ include "egernia.fullname" . }}-db
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: pg-run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: db-init
          configMap:
            name: {{ include "egernia.fullname" . }}-db-init
        - name: tmp
          emptyDir: {}
        - name: pg-run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .Values.postgresql.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage }}
{{- end }}
