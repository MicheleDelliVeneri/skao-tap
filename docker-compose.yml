services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: tap
      POSTGRES_PASSWORD: tap
      POSTGRES_DB: tap
      # postgres:18 defaults PGDATA to /var/lib/postgresql/<major>/docker and
      # declares /var/lib/postgresql as its volume. Pin it back under the
      # mount below, or the cluster would initialise outside the named volume
      # and be discarded on every `docker compose down`.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tap -d tap"]
      interval: 5s
      timeout: 3s
      retries: 20

  tap-api:
    build:
      context: .
      dockerfile: services/egernia-api/Dockerfile
    environment:
      TAP_DATABASE_URL: postgresql://tap:tap@db:5432/tap
      TAP_BASE_URL: http://localhost:8080/tap
      TAP_RESULTS_DIR: /results
    volumes:
      - results:/results
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  tap-executor:
    build:
      context: .
      dockerfile: services/egernia-executor/Dockerfile
    environment:
      TAP_DATABASE_URL: postgresql://tap:tap@db:5432/tap
      TAP_BASE_URL: http://localhost:8080/tap
      TAP_RESULTS_DIR: /results
    expose:
      - "9100"
    volumes:
      - results:/results
    depends_on:
      db:
        condition: service_healthy

  # A Prometheus for local work, so the metrics can be looked at without a
  # cluster. Production scrapes the same endpoints from its own instance.
  prometheus:
    image: prom/prometheus:v3.6.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=24h
    volumes:
      - ./charts/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - tap-api
      - tap-executor

volumes:
  pgdata:
  results:
  promdata:
