# Single-node kind cluster for the benchmark.
#
# One node on purpose: the point is to measure the service against a fixed
# resource budget, and spreading it over several kind "nodes" that share the
# same kernel and the same disk would only add scheduling noise to the same
# hardware. The budget is imposed on the node container after creation
# (docker update --cpus/--memory), which is the only place kind's node
# resources can be capped.
#
# The API's NodePort is mapped to the host so the load generator can reach it
# without kubectl port-forward: a single forwarder process is a proxy in the
# measurement path and becomes the bottleneck long before the service does.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: egernia-bench
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            # cAdvisor housekeeping has to be at least as fast as the scrape
            # interval, or a 2-second scrape returns the same sample twice and
            # a CPU spike disappears into a flat line.
            housekeeping-interval: "1s"
    extraPortMappings:
      - containerPort: 30080      # tap-api
        hostPort: 30080
        protocol: TCP
      - containerPort: 30090      # prometheus
        hostPort: 30090
        protocol: TCP
