# Prometheus and kube-state-metrics for the benchmark.
#
# Not the chart's bundled Prometheus: that one scrapes the TAP pods, which is
# the right scope for a deployment and half of what a benchmark needs. This
# one also scrapes cAdvisor (container CPU, throttling, memory, network,
# filesystem), kube-state-metrics (replica counts, restarts, OOM kills, pod
# conditions) and the KEDA operator (scaler value, activity, latency, errors).
#
# scrape_interval is 2s. A 30s interval cannot describe a scale-out event that
# completes in 20, and every KEDA timing in this suite is read off these
# series.
---
apiVersion: v1
kind: Namespace
metadata:
  name: benchmon
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: benchmon
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: benchmon-prometheus
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: benchmon-prometheus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: benchmon-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: benchmon
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: benchmon
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      scrape_timeout: 1900ms
      evaluation_interval: 10s
    scrape_configs:
      # Container CPU/memory/throttling/network/filesystem, straight from the
      # kubelet's cAdvisor endpoint through the API server proxy.
      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

      # Node-level CPU and memory, for the "did the host itself saturate?"
      # question that container metrics cannot answer.
      - job_name: kubelet
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics

      - job_name: kube-state-metrics
        static_configs:
          - targets: ["kube-state-metrics.benchmon.svc:8080"]

      # Everything that annotates itself: the TAP API, the executor, and the
      # KEDA operator (which is annotated by its own chart).
      - job_name: annotated-pods
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_component]
            target_label: component

      # KEDA's operator and metrics-apiserver publish keda_scaler_* here. Named
      # explicitly rather than left to annotations: these series are the
      # detection-latency measurement, so losing them silently would turn T1
      # into a guess.
      - job_name: keda
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [keda]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "8080|8081|9022"
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: benchmon
spec:
  replicas: 1
  selector:
    matchLabels: {app: prometheus}
  template:
    metadata:
      labels: {app: prometheus}
    spec:
      serviceAccountName: prometheus
      # 65534 is the image's own nobody; fsGroup so the emptyDir TSDB stays
      # writable once the root filesystem is not.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: prom/prometheus:v3.6.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=24h
            # 2-second scrapes of cAdvisor produce a lot of samples; give the
            # head block room so a long run does not evict what it measured.
            - --storage.tsdb.min-block-duration=15m
            - --storage.tsdb.max-block-duration=15m
            - --web.enable-admin-api
          ports:
            - containerPort: 9090
          volumeMounts:
            - {name: config, mountPath: /etc/prometheus}
            - {name: data, mountPath: /prometheus}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {memory: 2Gi}
      volumes:
        - name: config
          configMap: {name: prometheus-config}
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: benchmon
spec:
  type: NodePort
  selector: {app: prometheus}
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: benchmon
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: benchmon-kube-state-metrics
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, endpoints, replicationcontrollers, resourcequotas, limitranges, persistentvolumeclaims, persistentvolumes, namespaces, events]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: benchmon-kube-state-metrics
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: benchmon-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: benchmon
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: benchmon
spec:
  replicas: 1
  selector:
    matchLabels: {app: kube-state-metrics}
  template:
    metadata:
      labels: {app: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.15.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports:
            - containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: benchmon
spec:
  selector: {app: kube-state-metrics}
  ports:
    - port: 8080
      targetPort: 8080
