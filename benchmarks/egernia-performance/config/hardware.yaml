# The budget this suite is designed against, and what this machine actually
# offers. Both are recorded with every run: a number is only comparable to
# another number taken under the same shape.
#
# 2026-08-24: the shape changed. The suite moved from a 16-core / 24 GiB host
# to a 30-core / 120 GiB one, and the budget below is the new host rather than
# the old one carried forward — running a 24-core node's worth of service
# under a 12-core cap would measure the cap. What that costs is stated rather
# than left implicit: **absolute numbers taken on the old budget are not
# comparable to numbers taken on this one.** Shapes are (a saturation curve is
# still a saturation curve), and every run carries the budget it ran under, so
# which family a figure belongs to is always recoverable.
budget:
  host_cpus: 30
  host_memory_gib: 120
  host_storage_gb: 440
  # Six cores and the rest of the memory stay outside the cluster for the load
  # generator. Generously: a generator that queues on its own event loop
  # reports its own ceiling as the service's, and it is not busy while it
  # waits, so the CPU guard cannot see it happen.
  kubernetes_cpus: 24
  kubernetes_memory_gib: 96
  # Doubled from the old budget's 4/6, and deliberately no further. A 25 GiB
  # database has to stay bigger than what PostgreSQL can cache for D3 and D4
  # to mean anything: the I/O-bound regime is the thing those tiers exist to
  # measure, and a 96 GiB shared buffer would delete it.
  postgres_cpus: 8
  postgres_memory_gib: 12
  postgres_storage_cap_gb: 200
  # Unchanged at 8 on purpose. maxReplicas is an operator's explicit budget
  # and the autoscaling family's measured wall; moving it with the hardware
  # would silently redefine every K1-K7 result rather than re-measure it.
  tap_replicas_min: 1
  tap_replicas_max: 8

# How the budget is imposed. The cluster runs inside the Docker VM and is
# capped there (kind has no CPU/memory setting of its own); the load
# generator runs on the host, outside that cap, so it cannot eat the
# capacity it is measuring — and its own CPU is watched, because a saturated
# generator reports the generator's limit as the service's.
enforcement:
  kind_node_cpus: 24
  kind_node_memory: 96g
  load_generator_on_host: true
  # Below this the suite refuses to start a run and marks any in flight
  # invalid: a database that fills the disk mid-measurement produces numbers
  # that describe the disk. Scaled with the budget: D4 is 45 GiB and the
  # storage cap is 200, so 15 GiB of headroom is no longer headroom.
  min_free_disk_gb: 40
