# Sizes are ACTUAL pg_database_size(), indexes included — not row counts.
# Generation is one growing database checkpointed at each target, so D4 costs
# 45 GB of disk rather than D1+D2+D3+D4 = 82 GB, and every tier is a real
# prefix of the next.
datasets:
  - name: D1
    target_bytes: 2147483648        # 2 GiB
  - name: D2
    target_bytes: 10737418240       # 10 GiB
  # The larger tiers carry their own warmup. The measured fact behind it:
  # with the default 60 s warmup the first repetition at each size was
  # colder than the rest (D1's first window read 280 MiB, D2's 1,091 MiB),
  # so the first repetition was a property of the cache, not the service.
  # A working set bigger than memory never becomes "warm" — the target is
  # the steady-state hit ratio, which takes as long as reading the hot set
  # once.
  - name: D3
    target_bytes: 26843545600       # 25 GiB
    warmup_seconds: 300
  - name: D4
    target_bytes: 48318382080       # 45 GiB
    warmup_seconds: 600
  # The demo tier (deploy/demo). Not part of any benchmark family: the size
  # sweep's story is told by D1-D4, and a fifth point costs another 55 GiB of
  # generation for a curve that already has its shape. This exists so the
  # multi-machine demo can say "a hundred gigabytes" and mean it.
  - name: D5
    target_bytes: 107374182400      # 100 GiB
    warmup_seconds: 900
    # Kept out of the families that sweep every tier by default. Named
    # explicitly (`--datasets D5`) it behaves like any other.
    demo_only: true

generation:
  seed: 20260823
  # Rows per COPY batch. Sized so a size check happens roughly every ~50 MB:
  # often enough to stop within a percent of the target, rarely enough that
  # pg_database_size() is not itself the workload.
  batch_rows: 50000
  # Planes per observation, artifacts per plane, and so on — the fan-out that
  # makes the CAOM joins mean something.
  planes_per_observation: [1, 3]
  artifacts_per_plane: [1, 4]
  parts_per_artifact: [1, 2]
  chunks_per_part: [1, 2]
  collections: ["SKA-LOW", "SKA-MID", "SKA-VLBI", "PRECURSOR-ASKAP", "PRECURSOR-MEERKAT"]
  instruments: ["LOW-AA4", "MID-AA4", "LOW-AA2", "MID-AA0.5", "ASKAP-36", "MEERKAT-64"]
  bands: ["Radio", "Millimeter"]
  dataproduct_types: ["cube", "image", "visibility", "spectrum", "timeseries"]
  calib_levels: [0, 1, 2, 3]
  # MJD span: ten years of observing, so temporal queries have selectivity to
  # find rather than a uniform smear.
  mjd_range: [58849.0, 62501.0]
