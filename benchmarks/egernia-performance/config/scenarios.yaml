timing:
  warmup_seconds: 60
  measure_seconds: 180
  repetitions: 3
  # A saturation point is where the interesting numbers live, so it is
  # measured for longer and more often.
  saturation_measure_seconds: 300
  saturation_repetitions: 5
  # Between runs: let the pool drain, the queue empty and the page cache
  # settle, so a run does not inherit its predecessor's state.
  settle_seconds: 30
  # Requests the open-loop generator will hold outstanding before it starts
  # abandoning arrivals. Reaching it turns an open-loop measurement into a
  # closed-loop one at this concurrency, which a guard now marks — so the value
  # is a statement about what the harness can offer, not a tuning knob.
  max_in_flight: 4096
  # Async jobs wait in a queue rather than in the service, so they accumulate
  # far more outstanding requests at the same offered rate: a KEDA scenario
  # abandoned 38.6% of its arrivals at 4096, which shrinks the very backlog the
  # autoscaler is being measured on. Affordable at this size because a queued
  # job's phase poll backs off after its first seconds.
  max_in_flight_async: 20000

concurrency_sweep:
  levels: [1, 2, 4, 8, 16, 32, 64, 128]
  # Climbing stops when at least this many saturation signals agree. One
  # signal alone is noise; two together are a ceiling.
  saturation_signals_required: 2
  signals:
    throughput_gain_below_fraction: 0.05
    p95_multiple_of_baseline: 5.0
    error_rate_above_fraction: 0.01
    tap_cpu_above_fraction: 0.95
    postgres_cpu_above_fraction: 0.95

fixed_replica_scaling:
  replicas: [1, 2, 4, 8]
  # Offered rates as multiples of C1, the sustainable capacity of one replica.
  c1_multiples: [0.5, 1.0, 2.0, 4.0, 6.0, 8.0]
  dataset: D4

keda_scenarios:
  - id: K1
    description: idle to 0.5*C1
    steps: [{rate_multiple: 0.0, seconds: 120}, {rate_multiple: 0.5, seconds: 600}]
  - id: K2
    description: 0.5*C1 step to 3.5*C1
    steps: [{rate_multiple: 0.5, seconds: 300}, {rate_multiple: 3.5, seconds: 600}]
  - id: K3
    description: 0 to 6*C1 spike
    steps: [{rate_multiple: 0.0, seconds: 120}, {rate_multiple: 6.0, seconds: 600}]
  - id: K4
    description: 0.5*C1 to 6*C1 gradual 10-minute ramp
    steps: [{rate_multiple: 0.5, seconds: 120}, {ramp_to_multiple: 6.0, seconds: 600}, {rate_multiple: 6.0, seconds: 180}]
  - id: K5
    description: alternating 0.5*C1 and 4*C1 every 2 minutes
    steps: [{rate_multiple: 0.5, seconds: 120}, {rate_multiple: 4.0, seconds: 120}, {rate_multiple: 0.5, seconds: 120}, {rate_multiple: 4.0, seconds: 120}, {rate_multiple: 0.5, seconds: 120}, {rate_multiple: 4.0, seconds: 120}]
  - id: K6
    description: sustained 6*C1 for 15 minutes
    steps: [{rate_multiple: 0.5, seconds: 120}, {rate_multiple: 6.0, seconds: 900}]
  - id: K7
    description: 4*C1 to 0.2*C1 recovery
    steps: [{rate_multiple: 4.0, seconds: 420}, {rate_multiple: 0.2, seconds: 600}]

# Package 10: the same rows out through every writer, everything else held
# still. Q11 is the class where the response body dominates and Q10 is the
# same path an order of magnitude in, so a cost that scales with rows can be
# told apart from one that is charged per request. Run closed-loop at a
# concurrency the service meets comfortably: the question is what a large
# result costs, not where the service saturates while producing them.
result_formats:
  dataset: D1
  query_classes: [Q10, Q11]
  formats: [votable, csv, tsv, json, parquet, arrow]
  concurrency: 4
  warmup_seconds: 20
  measure_seconds: 60
  repetitions: 3

# Package 14: the closed-loop concurrency sweep, once per replica count. The
# open-loop fixed-scaling rungs kept failing to bracket anything (seventeen
# of 24 measurements generator-capped); a closed loop cannot be capped that
# way, and its two-signal saturation stop is itself the bracket. Shorter
# windows than the C1 sweep: this family wants four comparable ceilings, not
# the suite's best-measured single number.
replica_sweep:
  replicas: [1, 2, 4, 8]
  warmup_seconds: 15
  measure_seconds: 45
  repetitions: 2
  # One asyncio loop tops out around one core (~400 requests/second of this
  # workload), which is less than an eight-replica fleet serves: the first
  # run of this family measured its own generator at the top rungs. Four
  # processes put the client ceiling far above the fleet's.
  generator_processes: 4

# Package 19: workers against replicas, on one host. The replica ladder was
# measured at one worker per pod against a 2-core CPU limit, so every point
# in it was half-idle by construction. Same closed-loop ladder and stop rule
# as the replica sweep, once per (workers, replicas) point — same host, same
# corpus, same workload seeds, so two points differ in the fleet's shape and
# nothing else. Workers 1/2/4 against the 2-core pod is under-, at- and
# over-subscribed: the chart's guidance ("set workers to the pod's CPU limit
# and no higher") is a claim this grid either measures or corrects. The two
# axes are not interchangeable at the database — a pod's pool ceiling is
# workers x dbPoolMax — so every point's connection arithmetic is recorded
# beside its capacity.
worker_sweep:
  workers: [1, 2, 4]
  replicas: [1, 2, 4, 8]
  warmup_seconds: 15
  measure_seconds: 45
  repetitions: 2
  # Six, not the replica sweep's four: the top of this grid is a fleet of up
  # to 16 worker processes, which serves more than four generator processes
  # (~400 requests/second each) can offer, and the hardware budget reserves
  # six host cores for the generator.
  generator_processes: 6
  # One point past the grid, because the grid's own w=4 row cannot answer the
  # question it looks like it answers. One worker costs ~1.05 cores (package
  # 18's profile) and two want 2.10 against the pod's 2-core limit, so at the
  # suite limit every worker count past 2 measures chart-values.yaml, not
  # uvicorn. This probe reruns w=4 with the CPU limit raised to 4 — and the
  # memory limit raised with it, because one worker peaks at ~278 MiB and
  # four against 1Gi would make an OOM the confound rather than the finding.
  # "Workers stop scaling at 2" and "this pod stops at 2 cores" are
  # distinguishable only by this point.
  limit_probe:
    workers: 4
    replicas: 1
    cpu_limit_cores: 4
    memory_limit: 2Gi

# Package 13: where does shed load stop being an answer? A closed loop is
# bounded concurrency by construction — each client has exactly one request
# outstanding — so holding it far past saturation is the sustained-overload
# point the open-loop generator cannot keep still. The ladder brackets the
# accept backlog (uvicorn --backlog, 2,048 by default): the first hypothesis
# for the socket drops is the listen queue overflowing before the
# application sees the connection. limit_concurrency is the ceiling the
# verification pass sets — above a worker's normal concurrent load (D1
# saturates a replica at 4-8 clients) and, if the open pass is right, below
# where the resets begin.
shedding:
  dataset: D1
  replicas: [1, 2]
  held_concurrency: [32, 128, 512, 2048]
  limit_concurrency: 64
  warmup_seconds: 5
  measure_seconds: 45

# The p95 the scale-out clock stops at (T8). Not a service guarantee — a
# fixed line to measure recovery against, so "recovered" is a number and not
# a judgement.
slo:
  p95_seconds: 2.0

query_mix:
  normal:
    Q01: 0.05
    Q02: 0.15
    Q03: 0.15
    Q04: 0.10
    Q05: 0.25
    Q06: 0.10
    Q07: 0.10
    Q08: 0.05
    Q10: 0.05
  # Run on their own: each would otherwise dominate a mixed run's latency
  # distribution and hide what the other classes were doing.
  stress_classes: [Q09, Q11, Q13, Q14]

corpus:
  seed: 20260823
  combinations: 12000
