# egernia at the 16 CPU / 16 GiB tier (PROTOCOL.md). The three serving
# containers share one 16-core cpuset, like DaCHS's single 16-cpu pool; the
# memory splits 1/2 db, 1/4 api, 1/4 executor as in the parity pins.
# PostgreSQL follows docs/postgres-performance.md "Sizing the server to its
# container": shared_buffers 1/4 and effective_cache_size 3/4 of the db
# limit, max_parallel_workers >= (api workers x 8 + executor 8) x 2,
# max_worker_processes = that + 8. API workers: 2.
#
#   docker compose -f docker-compose.yml -f benchmarks/tap-compare/scaling/pins/egernia-16.yml \
#       up -d --no-build db tap-api tap-executor
services:
  db:
    cpuset: "0-15"
    mem_limit: 8g
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=6GB
      - -c
      - work_mem=64MB
      - -c
      - max_parallel_workers=48
      - -c
      - max_worker_processes=56
  tap-api:
    cpuset: "0-15"
    mem_limit: 4g
    environment:
      TAP_API_WORKERS: "2"
  tap-executor:
    cpuset: "0-15"
    mem_limit: 4g
