# egernia at the 24 CPU / 24 GiB tier (PROTOCOL.md). The three serving
# containers share one 24-core cpuset, like DaCHS's single 24-cpu pool; the
# memory splits 1/2 db, 1/4 api, 1/4 executor as in the parity pins.
# PostgreSQL follows docs/postgres-performance.md "Sizing the server to its
# container": shared_buffers 1/4 and effective_cache_size 3/4 of the db
# limit, max_parallel_workers >= (api workers x 8 + executor 8) x 2,
# max_worker_processes = that + 8. API workers: 4.
#
#   docker compose -f docker-compose.yml -f benchmarks/tap-compare/scaling/pins/egernia-24.yml \
#       up -d --no-build db tap-api tap-executor
services:
  db:
    cpuset: "0-23"
    mem_limit: 12g
    command:
      - postgres
      - -c
      - shared_buffers=3GB
      - -c
      - effective_cache_size=9GB
      - -c
      - work_mem=64MB
      - -c
      - max_parallel_workers=80
      - -c
      - max_worker_processes=88
  tap-api:
    cpuset: "0-23"
    mem_limit: 6g
    environment:
      TAP_API_WORKERS: "4"
  tap-executor:
    cpuset: "0-23"
    mem_limit: 6g
