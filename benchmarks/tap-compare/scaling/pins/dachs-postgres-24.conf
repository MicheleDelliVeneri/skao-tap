# tap-compare scaling tier 24: DaCHS's PostgreSQL sized to its 24 GiB /
# 24-CPU container by the rule in docs/postgres-performance.md —
# shared_buffers 1/4 and effective_cache_size 3/4 of the memory limit, and
# the same parallel budget egernia's database gets at this tier (DaCHS
# opened 8 active connections under 8 clients, so the stock cap of 8
# parallel workers would starve its parallel plans exactly as PR #146
# found for egernia).
shared_buffers = 6GB
effective_cache_size = 18GB
max_parallel_workers = 80
max_worker_processes = 88
