# Scrape configuration for the compose stack and the chart's optional
# Prometheus. A production deployment scrapes these endpoints from its own
# Prometheus instead — the targets and metric names are the same either way.
global:
  scrape_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: tap-api
    metrics_path: /metrics
    static_configs:
      - targets: ["tap-api:8080"]

  # The executor is a worker loop with no HTTP API of its own, so it serves
  # metrics on a port of their own.
  - job_name: tap-executor
    metrics_path: /metrics
    static_configs:
      - targets: ["tap-executor:9100"]
