{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "egernia.fullname" . }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "egernia.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range include "egernia.serviceHosts" . | splitList "," }}
    - host: {{ . | quote }}
      http:
        paths:
          {{- include "egernia.ingressPaths" $ | nindent 10 }}
    {{- end }}
    {{- if .Values.ingress.catchAll }}
    {{- /* A rule with no host matches any of them, so the service answers
           however it was reached — including by an IP literal, which the
           Ingress API refuses to accept as a host name. Opt-in: on a shared
           ingress controller this claims every hostname nothing else routes. */}}
    - http:
        paths:
          {{- include "egernia.ingressPaths" $ | nindent 10 }}
    {{- end }}
{{- end }}
