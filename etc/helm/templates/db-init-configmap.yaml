{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "egernia.fullname" . }}-db-init
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "egernia.labels" . | nindent 4 }}
data:
  {{- (.Files.Glob "files/db-init/*.sql").AsConfig | nindent 2 }}
{{- end }}
