{{- /*
Skipped entirely when databaseSecret.existing is set: something else owns the
credentials then — External Secrets pulling them from Vault, in the SRCNet
deployment stack — and a chart that also rendered this Secret would fight it
for the same name on every upgrade.
*/}}
{{- if not .Values.databaseSecret.existing }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "egernia.fullname" . }}-db
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "egernia.labels" . | nindent 4 }}
type: Opaque
stringData:
  TAP_DATABASE_URL: {{ include "egernia.databaseUrl" . | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_USER: {{ .Values.postgresql.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  {{- end }}
{{- end }}
