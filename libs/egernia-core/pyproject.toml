[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egernia-core"
version = "0.1.0"
description = "Shared core for the egernia microservices: ADQL translation, typed streaming result serialization, UWS job model"
requires-python = ">=3.14"
dependencies = [
    # >=3.2 for Cursor.stream(size=...), which StreamedRows uses for
    # chunked retrieval on libpq 17+
    "psycopg[binary,pool]>=3.2",
    "pyarrow>=17.0",
    "queryparser-python3>=0.7",
    "pydantic>=2.0",
    "annotated-types>=0.6",
    # bearer-token verification against the IAM's JWKS (egernia_core.auth)
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    # SRCNet's shared logging/observability library: structured logs, request
    # context, Prometheus metrics and OpenTelemetry. Pinned to a commit until
    # published to a public index, like the other SKA SRC packages here.
    "ska-src-logging",
]

[tool.uv.sources.ska-src-logging]
git = "https://gitlab.com/ska-telescope/src/src-api/ska-src-api-logging.git"
rev = "9cdeaea15d2a"

[tool.setuptools.packages.find]
include = ["egernia_core*"]
