[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-api"
version = "0.1.0"
description = "SKAO TAP service HTTP frontend: /sync, /async (UWS), VOSI endpoints"
requires-python = ">=3.14"
dependencies = [
    "tapcore",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    # SKA SRC notification data models: drive the srcnet DB schema and
    # validate /api/v1/notifications payloads.
    "ska-src-mm-notification>=0.1.7",
    # SKA Software Discovery metadata model, for the built-in "software"
    # metadata plugin. Pinned to a commit until published to a public index.
    "ska-src-sdm",
]

[tool.uv.sources.ska-src-sdm]
git = "https://gitlab.com/ska-telescope/src/src-mm/ska-src-mm-software-data-model.git"
rev = "cfb341ec307ce35f463065455b11317dc1a0ead9"

# Metadata-domain plugins shipped by this service; third-party model
# packages register in the same group (see tapcore.plugins).
[project.entry-points."skao_tap.models"]
odp = "tap_api.plugins.odp:PLUGIN"
software = "tap_api.plugins.software:PLUGIN"

[tool.uv.sources]
tapcore = { workspace = true }

[tool.setuptools.packages.find]
include = ["tap_api*"]
