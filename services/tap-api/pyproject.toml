[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-api"
version = "0.1.0"
description = "SKAO TAP service HTTP frontend: /sync, /async (UWS), VOSI endpoints"
requires-python = ">=3.11"
dependencies = [
    "tapcore",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
tapcore = { workspace = true }

[tool.setuptools.packages.find]
include = ["tap_api*"]
