[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egernia-executor"
version = "0.1.0"
description = "egernia UWS job executor worker"
requires-python = ">=3.14"
dependencies = [
    "egernia-core",
]

[tool.uv.sources]
egernia-core = { workspace = true }

[tool.setuptools.packages.find]
include = ["egernia_executor*"]
