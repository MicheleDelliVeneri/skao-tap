[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tap-executor"
version = "0.1.0"
description = "SKAO TAP UWS job executor worker"
requires-python = ">=3.11"
dependencies = [
    "tapcore",
]

[tool.uv.sources]
tapcore = { workspace = true }

[tool.setuptools.packages.find]
include = ["tap_executor*"]
