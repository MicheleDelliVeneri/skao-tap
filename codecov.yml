coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 0%        # hard floor, no drift allowance
        if_not_found: success
        if_ci_failed: error
    patch:
      default:
        informational: true  # advisory, as before
comment:
  layout: "condensed_header, diff, flags"
  require_changes: true
flag_management:
  default_rules:
    carryforward: true
