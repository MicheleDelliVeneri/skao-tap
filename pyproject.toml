# uv workspace root (not an installable package): shared tooling config,
# dev dependency groups, and the workspace member list.
[project]
name = "egernia"
version = "0.1.0"
description = "egernia: an IVOA TAP 1.1 server — microservices on PostgreSQL"
requires-python = ">=3.14"
dependencies = [
    "egernia-core",
    "egernia-api",
    "egernia-executor",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/egernia-core", "services/egernia-api", "services/egernia-executor"]

[tool.uv.sources]
egernia-core = { workspace = true }
egernia-api = { workspace = true }
egernia-executor = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "pytest-cov>=6.0",
    "httpx>=0.27",
    "pyvo>=1.5",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]
# deploy/demo: the marimo notebook that drives the multi-machine demo. Kept
# out of `dev` because nothing in CI runs it and it pulls a UI stack.
demo = [
    "marimo>=0.9",
    "httpx>=0.27",
    "pyvo>=1.5",
    "altair>=5.4",
    "pandas>=2.2",
]
# benchmarks/egernia-performance. Kept out of `dev` because it is heavier than the
# test suite needs and nothing in CI imports it.
benchmark = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pyarrow>=17",
    "psutil>=6.0",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
    "jinja2>=3.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
    "*.egg-info",
    # ANTLR-generated parser modules of the vendored ADQL 2.1 fork
    "libs/egernia-core/egernia_core/query/_adql/ADQL*.py",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "SIM108", # ternary operator not always clearer
]

[tool.ruff.format]
# vendored from queryparser: keeps upstream's layout so diffs against
# upstream stay readable (it is still linted, with the ignores below)
exclude = ["libs/egernia-core/egernia_core/query/_adql/translator.py"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# marimo notebooks are Python files whose cells end in a bare expression —
# that expression IS the cell's rendered output, not a statement with no
# effect. Everything else stays enforced.
"demo/*.py" = ["B018"]
# vendored from queryparser: keeps upstream's style so diffs against
# upstream stay readable
"libs/egernia-core/egernia_core/query/_adql/translator.py" = [
    "UP004", "UP008", "UP009", "UP030", "UP031", "UP032", "B904", "C419", "RUF005", "SIM",
]

[tool.pyright]
# resolve the workspace's editable installs (and their third-party deps)
# from the uv venv, so imports are not reported missing per file
venvPath = "."
venv = ".venv"
extraPaths = ["libs/egernia-core", "services/egernia-api", "services/egernia-executor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "component: end-to-end tests requiring PostgreSQL and the running services",
]
addopts = "-ra"
timeout = 120

[tool.coverage.run]
source_pkgs = ["egernia_core", "egernia_api", "egernia_executor"]
parallel = true
relative_files = true
omit = [
    # ANTLR-generated parser modules of the vendored ADQL 2.1 fork, excluded
    # for the same reason [tool.ruff] extend-exclude skips them: they are
    # machine output, not code anyone here writes or can meaningfully test.
    # A generated recursive-descent parser carries a branch per grammar
    # alternative, so most of it is unreachable for any real query — 7,396 of
    # its statements were being measured, 2,984 of them missed, which was over
    # 90% of every uncovered line in the project and put the 80% gate out of
    # reach permanently. The hand-written translator.py beside them stays
    # measured, exactly as ruff still lints it.
    "*/egernia_core/query/_adql/ADQL*.py",
]

[tool.coverage.paths]
sources = ["libs/egernia-core/egernia_core", "services/egernia-api/egernia_api", "services/egernia-executor/egernia_executor"]
