apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "skao-tap.fullname" . }}-tap-api
  labels:
    {{- include "skao-tap.labels" . | nindent 4 }}
    app.kubernetes.io/component: tap-api
spec:
  {{- /* omitted when an autoscaler owns it: a helm upgrade that set
         replicas would reset the count the autoscaler had chosen, and
         the two would then take turns overwriting each other */}}
  {{- if not (include "skao-tap.apiAutoscaled" .) }}
  replicas: {{ .Values.tapApi.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: tap-api
  template:
    metadata:
      annotations:
        # the API serves metrics on its own port; a deployment's own Prometheus discovers pods by these
        prometheus.io/scrape: {{ .Values.metrics.scrapeAnnotations | quote }}
        prometheus.io/path: /metrics
        prometheus.io/port: "{{ .Values.tapApi.port }}"
      labels:
        {{- include "skao-tap.labels" . | nindent 8 }}
        app.kubernetes.io/component: tap-api
    spec:
      {{- include "skao-tap.scheduling" (dict "ctx" $ "component" "tap-api" "values" .Values.tapApi) | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: tap-api
          image: "{{ .Values.image.registry }}/tap-api:{{ include "skao-tap.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.tapApi.port }}
          envFrom:
            - configMapRef:
                name: {{ include "skao-tap.fullname" . }}-config
            - secretRef:
                name: {{ include "skao-tap.fullname" . }}-db
          volumeMounts:
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /tap/availability
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /tap/availability
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            {{- toYaml .Values.tapApi.resources | nindent 12 }}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: {{ include "skao-tap.fullname" . }}-results
        - name: tmp
          emptyDir: {}
