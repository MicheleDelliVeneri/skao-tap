apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "skao-tap.fullname" . }}-config
  labels:
    {{- include "skao-tap.labels" . | nindent 4 }}
data:
  TAP_BASE_URL: {{ include "skao-tap.baseUrl" . | quote }}
  TAP_RESULTS_DIR: /results
  TAP_QUERY_ROLE: {{ .Values.config.queryRole | quote }}
  {{- /* int64 guards against Helm rendering large numbers as 1e+06 */}}
  TAP_DEFAULT_MAXREC: {{ .Values.config.defaultMaxrec | int64 | quote }}
  TAP_HARD_MAXREC: {{ .Values.config.hardMaxrec | int64 | quote }}
  TAP_SYNC_TIMEOUT: {{ .Values.config.syncTimeoutSeconds | int64 | quote }}
  TAP_ASYNC_EXEC_DURATION: {{ .Values.config.asyncExecDurationSeconds | int64 | quote }}
  TAP_JOB_RETENTION: {{ .Values.config.jobRetentionSeconds | int64 | quote }}
  TAP_WAIT_MAX: {{ .Values.config.waitMaxSeconds | int64 | quote }}
  TAP_MODEL_PLUGINS: {{ .Values.config.modelPlugins | quote }}
  TAP_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  {{- /* authn/authz; disabled by default, see values.yaml */}}
  TAP_AUTH_ENABLED: {{ .Values.auth.enabled | quote }}
  {{- if .Values.auth.enabled }}
  TAP_AUTH_PLUGIN: {{ .Values.auth.plugin | quote }}
  TAP_IAM_ISSUER: {{ required "auth.iam.issuer is required when auth.enabled=true (tokens are always verified against the IAM)" .Values.auth.iam.issuer | quote }}
  TAP_IAM_AUDIENCE: {{ .Values.auth.iam.audience | quote }}
  TAP_IAM_WELL_KNOWN_URL: {{ .Values.auth.iam.wellKnownUrl | quote }}
  TAP_IAM_JWKS_CACHE: {{ .Values.auth.iam.jwksCacheSeconds | int64 | quote }}
  TAP_AUTH_ROLES: {{ .Values.auth.roles | toJson | quote }}
  {{- if eq .Values.auth.plugin "permissions-api" }}
  TAP_PERMISSIONS_API_URL: {{ required "auth.permissionsApi.url is required when auth.plugin=permissions-api" .Values.auth.permissionsApi.url | quote }}
  TAP_PERMISSIONS_SERVICE_NAME: {{ .Values.auth.permissionsApi.serviceName | quote }}
  TAP_PERMISSIONS_SERVICE_VERSION: {{ .Values.auth.permissionsApi.serviceVersion | quote }}
  TAP_PERMISSIONS_TIMEOUT: {{ .Values.auth.permissionsApi.timeoutSeconds | int64 | quote }}
  {{- end }}
  {{- end }}
