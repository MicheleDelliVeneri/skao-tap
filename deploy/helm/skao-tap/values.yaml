# -- Container images. CI publishes ghcr.io/<repo>/{tap-api,tap-executor,tap-db}.
image:
  registry: ghcr.io/micheledelliveneri/skao-tap
  tag: latest
  pullPolicy: IfNotPresent

tapApi:
  # -- Safe to scale out; pair >1 with a ReadWriteMany results volume.
  replicas: 1
  port: 8080
  # -- Externally visible base URL, written into capabilities and result
  # links. Leave empty to default to the in-cluster service URL.
  baseUrl: ""
  # -- Override the chart's default spreading (see `scheduling`) wholesale.
  affinity: {}
  topologySpreadConstraints: []
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

tapExecutor:
  # -- Executors claim jobs with FOR UPDATE SKIP LOCKED; scaling out is safe
  # provided the results volume is ReadWriteMany (see `results`).
  replicas: 1
  # -- Override the chart's default spreading (see `scheduling`) wholesale.
  affinity: {}
  topologySpreadConstraints: []
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# -- Resilience: spread each service's replicas across nodes (preferred
# pod anti-affinity) and zones (topology spread, ScheduleAnyway) — soft
# constraints, so single-node clusters schedule exactly as before. Per-
# component `affinity`/`topologySpreadConstraints` values override these.
scheduling:
  spreadReplicas: true

# -- Keep at least one pod of each service through voluntary disruptions
# (drains, upgrades). Only rendered for components with >1 replica.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# -- Vertical autoscaling of tap-api and tap-executor. Requires the VPA CRDs
# (https://github.com/kubernetes/autoscaler) in the cluster. Start with
# updateMode "Off" (recommendation only, read via `kubectl describe vpa`),
# move to "Auto" once the bounds are trusted.
verticalAutoscaling:
  enabled: false
  updateMode: "Off"
  tapApi:
    minAllowed:
      cpu: 100m
      memory: 256Mi
    maxAllowed:
      cpu: "2"
      memory: 4Gi
  tapExecutor:
    minAllowed:
      cpu: 100m
      memory: 256Mi
    maxAllowed:
      cpu: "2"
      memory: 4Gi

# -- Scheduled pg_dump backups of the whole database (jobs, TAP_SCHEMA,
# ingested metadata) to a dedicated PVC, pruned after retentionDays.
# Works against the in-chart PostgreSQL and externalDatabase alike. For
# point-in-time recovery see docs/deployment.md.
backup:
  enabled: false
  schedule: "0 2 * * *"
  # -- Keep dumps at least this many days; align with config.jobRetentionSeconds.
  retentionDays: 7
  deadlineSeconds: 1800
  storage: 10Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# -- TAP service tuning (mapped to TAP_* environment variables).
config:
  defaultMaxrec: 10000
  hardMaxrec: 1000000
  syncTimeoutSeconds: 30
  asyncExecDurationSeconds: 600
  jobRetentionSeconds: 604800
  waitMaxSeconds: 60
  # -- Metadata-domain plugins to activate: "all" or a comma-separated
  # subset (e.g. "odp" or "software") for dedicated per-model deployments.
  modelPlugins: all
  # -- Log level for the services' own records (schema bootstrap, legacy-table
  # warnings, metadata deletion audit trail). Uvicorn's access log is separate.
  logLevel: INFO
  queryRole: tap_reader

# -- Shared volume where the executor writes job results and the API serves
# them from. With >1 node use a ReadWriteMany storage class.
results:
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# -- In-chart PostgreSQL 16 + pg_sphere (the tap-db image), initialized from
# files/db-init. Disable and set externalDatabase.url to bring your own.
postgresql:
  enabled: true
  image: ""  # defaults to <image.registry>/tap-db:<image.tag>
  database: tap
  username: tap
  password: tap
  storage: 5Gi
  storageClass: ""
  # -- postgresql.conf overrides, passed as `-c key=value` server arguments.
  # Size to the pod's memory limit; typical starting points for 2Gi:
  #   max_connections: 100
  #   shared_buffers: 512MB
  #   effective_cache_size: 1536MB
  #   work_mem: 32MB              # per sort/hash node — large ADQL joins
  #   maintenance_work_mem: 128MB
  tuning: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

# -- Used when postgresql.enabled=false; full DSN including credentials.
externalDatabase:
  url: ""

# -- Pod/container hardening applied to tap-api and tap-executor (uid 10001
# matches the image user). Postgres gets its own contexts below.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

postgresqlSecurityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

ingress:
  enabled: false
  className: ""
  host: tap.example.org
  annotations: {}
  tls: []
