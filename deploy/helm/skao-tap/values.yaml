# -- Container images. CI publishes ghcr.io/<repo>/{tap-api,tap-executor,tap-db}.
image:
  registry: ghcr.io/micheledelliveneri/skao-tap
  tag: latest
  pullPolicy: IfNotPresent

tapApi:
  # -- Safe to scale out; pair >1 with a ReadWriteMany results volume.
  replicas: 1
  port: 8080
  # -- Externally visible base URL, written into capabilities and result
  # links. Leave empty to default to the in-cluster service URL.
  baseUrl: ""
  # -- Override the chart's default spreading (see `scheduling`) wholesale.
  affinity: {}
  topologySpreadConstraints: []
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

tapExecutor:
  # -- Executors claim jobs with FOR UPDATE SKIP LOCKED; scaling out is safe
  # provided the results volume is ReadWriteMany (see `results`).
  replicas: 1
  # -- Override the chart's default spreading (see `scheduling`) wholesale.
  affinity: {}
  topologySpreadConstraints: []
  nodeSelector: {}
  tolerations: []
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# -- Resilience: spread each service's replicas across nodes (preferred
# pod anti-affinity) and zones (topology spread, ScheduleAnyway) — soft
# constraints, so single-node clusters schedule exactly as before. Per-
# component `affinity`/`topologySpreadConstraints` values override these.
scheduling:
  spreadReplicas: true

# -- Keep at least one pod of each service through voluntary disruptions
# (drains, upgrades). Only rendered for components with >1 replica.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# -- Vertical autoscaling of tap-api and tap-executor. Requires the VPA CRDs
# (https://github.com/kubernetes/autoscaler) in the cluster. Start with
# updateMode "Off" (recommendation only, read via `kubectl describe vpa`),
# move to "Auto" once the bounds are trusted.
verticalAutoscaling:
  enabled: false
  updateMode: "Off"
  tapApi:
    minAllowed:
      cpu: 100m
      memory: 256Mi
    maxAllowed:
      cpu: "2"
      memory: 4Gi
  tapExecutor:
    minAllowed:
      cpu: 100m
      memory: 256Mi
    maxAllowed:
      cpu: "2"
      memory: 4Gi

# -- Scheduled pg_dump backups of the whole database (jobs, TAP_SCHEMA,
# ingested metadata) to a dedicated PVC, pruned after retentionDays.
# Works against the in-chart PostgreSQL and externalDatabase alike. For
# point-in-time recovery see docs/deployment.md.
backup:
  enabled: false
  schedule: "0 2 * * *"
  # -- Keep dumps at least this many days; align with config.jobRetentionSeconds.
  # The prune is clamped at one day, so 0 behaves the same as 1 — the CronJob
  # never deletes the archive it has just written.
  retentionDays: 7
  deadlineSeconds: 1800
  storage: 10Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

# -- Authentication and authorisation.
#
# Disabled by default: a deployment with no IAM behaves exactly as it did
# before auth existed, which is what local development, the demo notebook and
# the component tests rely on.
#
# Enabling it does two things. Mutating the metadata endpoints needs a token
# the plugin approves (see `roles` and `gatedOperations`), and every other
# request needs a verified token as well — service discovery and the health
# check aside. That second part includes querying: POST /tap/sync is how VO
# clients send ADQL, and they carry no token, so a deployment that wants to
# serve them sets `anonymousQueries: true` below.
#
# Whatever the plugin, bearer tokens are always verified by this service
# against the IAM's JWKS before any authorisation decision is taken.
auth:
  enabled: false
  # -- Which authorisation plugin decides. Shipped: "iam-groups" (local
  # decision from IAM groups/scopes, configured under `roles` below) and
  # "permissions-api" (delegate to the SKA SRC Permissions API). A site can
  # install its own in the skao_tap.auth entry-point group and name it here.
  plugin: iam-groups
  # -- Require a verified token on every request except service discovery and
  # the health check (see anonymousQueries below for TAP reads). A metadata
  # GET then needs nothing more than a valid token, while mutations still
  # need the grants under `roles`, or a Permissions API decision.
  #
  # Requests refused for want of a token answer an IVOA AuthVO challenge
  # naming the IAM's discovery document, so a client can find the issuer and
  # go and get a token instead of being told to read the docs.
  requireToken: true
  # -- Let callers with no token read metadata through TAP: `/tap/sync` and
  # the `/tap/async` job with all its sub-resources. Nothing else — not the
  # JSON API's own query and job facades, which are reached by clients that
  # *can* authenticate.
  #
  # This is the switch that decides whether standard VO clients can use the
  # service at all: PyVO, TOPCAT and the rest send no token, so with it off
  # they get 401 on every query. Off by default, because who may read an
  # archive is a decision to take rather than inherit.
  anonymousQueries: false
  iam:
    # -- Token issuer, e.g. https://ska-iam.stfc.ac.uk. Required when enabled.
    issuer: ""
    # -- Expected token audience. Required when enabled: one IAM issues
    # tokens to many services, so without this check a token minted for any
    # other client of the same issuer is accepted here as its bearer's
    # credential. Set allowAnyAudience to deliberately accept that.
    audience: ""
    allowAnyAudience: false
    # -- Claims read as IAM group membership. Adding entitlement claims
    # (entitlements, eduperson_entitlement) means attributes asserted by a
    # federated home IdP are matched against the policy groups below.
    groupClaims: "groups,wlcg.groups"
    # -- Override the discovery URL if it is not <issuer>/.well-known/openid-configuration.
    wellKnownUrl: ""
    # -- How long the discovery document and signing keys are cached.
    jwksCacheSeconds: 300
  # -- Used when plugin=permissions-api. The service name must match a route
  # policy published by the Permissions API ("science-metadata" is registered).
  permissionsApi:
    url: ""          # e.g. https://permissions.srcnet.skao.int/api/v1
    serviceName: science-metadata
    serviceVersion: "1"
    timeoutSeconds: 10
  # -- Which operations the gate enforces. Empty means the service default:
  # metadata mutation only (metadata.ingest, metadata.amend,
  # metadata.delete), which is what a deployment upgrading into this had.
  #
  # The job and query operations are opt-in for a reason: TAP clients submit
  # queries as POSTs, so enforcing jobs.create or query.sync turns away every
  # standard VO client that carries no token. Enforce them only where every
  # client is expected to authenticate.
  #
  # jobs.create, jobs.mutate, jobs.delete and query.sync are enforced as a
  # GROUP: listing some but not all of them is refused. A caller refused at
  # POST /tap/async runs the same query at /tap/sync, and gating job mutation
  # without job creation hands a client a job it cannot start. The metadata
  # operations stay independent of each other.
  #
  # Known operations: metadata.ingest, metadata.amend, metadata.delete,
  # jobs.create, jobs.mutate, jobs.delete, query.sync. The single entry
  # ["none"] enforces nothing while still verifying tokens and recording job
  # ownership; a list that names no operation at all is rejected, so a typo
  # cannot quietly turn the gate off. With plugin=iam-groups
  # each one listed here must also be granted under `roles` below; the chart
  # refuses to render otherwise, because an enforced operation nobody is
  # granted is denied to everyone.
  #
  #   gatedOperations:
  #     - metadata.ingest
  #     - metadata.amend
  #     - metadata.delete
  #     - jobs.create
  #     - jobs.mutate
  #     - jobs.delete
  #     - query.sync
  gatedOperations: []
  # -- Used when plugin=iam-groups: what each gated operation requires. A
  # principal is allowed when its verified token carries any of the listed
  # groups or any of the listed scopes.
  #
  # Every grant is explicit: an operation omitted here, or listed with
  # neither groups nor scopes, is DENIED — an unfinished policy grants
  # nothing. Accepting any verified token has to be written down with
  # anyVerifiedToken. The chart refuses to render plugin=iam-groups with an
  # empty mapping, so enabling auth without a policy fails at deploy time.
  #
  #   roles:
  #     metadata.ingest:
  #       groups: ["/ska/science-metadata/oper"]
  #     metadata.amend:
  #       anyVerifiedToken: true
  #     metadata.delete:
  #       groups: ["/ska/science-metadata/admin"]
  #       scopes: ["science-metadata:admin"]
  roles: {}

# -- VO Registry publication. The service serves its VOResource record at
# GET /tap/registry, built from these values and its live capabilities, so the
# record cannot describe a service other than the one answering.
#
# Off by default, and every value below is a placeholder: an IVOA identifier
# is a permanent promise that `ivo://<authorityId>/<resourceKey>` resolves to
# this service, so it cannot be guessed. The chart refuses to render
# `enabled: true` while a required value is unset.
#
# Publishing the record is a separate, manual step: submit the document (or
# the URL) to a publishing registry — SKAO's own, or one that accepts
# submissions for the authority — which then makes it harvestable from the VO
# Registry. Nothing here contacts a registry on its own.
voRegistry:
  enabled: false
  # -- IVOA authority you are registered to publish under, e.g. "skao.int".
  authorityId: ""
  # -- Path within the authority, e.g. "srcnet/tap".
  resourceKey: ""
  # -- Human-readable title, e.g. "SKAO SRCNet TAP service".
  title: ""
  # -- At most 16 characters (VOResource limit), e.g. "SKAO TAP".
  shortName: ""
  # -- A paragraph on what is queryable here. Registry users read this first.
  description: ""
  # -- Landing page for humans, e.g. "https://srcnet.skao.int/tap".
  referenceUrl: ""
  # -- Organisation responsible for publishing, e.g. "SKA Observatory".
  publisher: ""
  # -- Optional: who produced the data.
  creator: ""
  # -- Optional support contact. A team alias, not a person: the record is
  # public and permanent.
  contact:
    name: ""     # e.g. "SRCNet operations"
    email: ""    # e.g. "srcnet-support@example.org"
  # -- At least one subject term is required, e.g. ["radio astronomy"].
  subjects: []
  # -- VOResource vocabularies; the defaults suit a science archive.
  types: ["Archive"]
  contentLevels: ["Research"]
  # -- ISO-8601 date the record was first published. Required, and fixed
  # once published: it identifies the resource's origin, not this revision.
  created: ""
  # -- ISO-8601 date of the current revision; defaults to `created`. This is
  # the one harvesters compare, so bump it whenever the record changes —
  # a changed record carrying an unchanged `updated` can be ignored.
  updated: ""

# -- TAP service tuning (mapped to TAP_* environment variables).
config:
  defaultMaxrec: 10000
  hardMaxrec: 1000000
  syncTimeoutSeconds: 30
  asyncExecDurationSeconds: 600
  jobRetentionSeconds: 604800
  waitMaxSeconds: 60
  # -- Metadata-domain plugins to activate: "all" or a comma-separated
  # subset (e.g. "odp" or "software") for dedicated per-model deployments.
  modelPlugins: all
  # -- Log level for the services' own records (schema bootstrap, legacy-table
  # warnings, metadata deletion audit trail). Uvicorn's access log is separate.
  logLevel: INFO
  queryRole: tap_reader

# -- Shared volume where the executor writes job results and the API serves
# them from. With >1 node use a ReadWriteMany storage class.
results:
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

# -- In-chart PostgreSQL 18 + pg_sphere (the tap-db image), initialized from
# files/db-init. Disable and set externalDatabase.url to bring your own.
postgresql:
  enabled: true
  image: ""  # defaults to <image.registry>/tap-db:<image.tag>
  database: tap
  username: tap
  password: tap
  storage: 5Gi
  storageClass: ""
  # -- postgresql.conf overrides, passed as `-c key=value` server arguments.
  # Size to the pod's memory limit; typical starting points for 2Gi:
  #   max_connections: 100
  #   shared_buffers: 512MB
  #   effective_cache_size: 1536MB
  #   work_mem: 32MB              # per sort/hash node — large ADQL joins
  #   maintenance_work_mem: 128MB
  tuning: {}
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 2Gi

# -- Used when postgresql.enabled=false; full DSN including credentials.
externalDatabase:
  url: ""

# -- Pod/container hardening applied to tap-api and tap-executor (uid 10001
# matches the image user). Postgres gets its own contexts below.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

postgresqlSecurityContext:
  pod:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  container:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

ingress:
  enabled: false
  className: ""
  host: tap.example.org
  annotations: {}
  tls: []
