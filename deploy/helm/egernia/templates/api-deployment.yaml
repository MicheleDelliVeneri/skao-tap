apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "egernia.fullname" . }}-tap-api
  labels:
    {{- include "egernia.labels" . | nindent 4 }}
    app.kubernetes.io/component: tap-api
spec:
  {{- /* omitted when an autoscaler owns it: a helm upgrade that set
         replicas would reset the count the autoscaler had chosen, and
         the two would then take turns overwriting each other */}}
  {{- if not .Values.horizontalAutoscaling.tapApi.enabled }}
  replicas: {{ .Values.tapApi.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: tap-api
  template:
    metadata:
      annotations:
        # the API serves metrics on its own port; a deployment's own Prometheus discovers pods by these
        prometheus.io/scrape: {{ .Values.metrics.scrapeAnnotations | quote }}
        prometheus.io/path: /metrics
        prometheus.io/port: "{{ .Values.tapApi.port }}"
      labels:
        {{- include "egernia.labels" . | nindent 8 }}
        app.kubernetes.io/component: tap-api
    spec:
      {{- include "egernia.scheduling" (dict "ctx" $ "component" "tap-api" "values" .Values.tapApi) | nindent 6 }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: tap-api
          image: "{{ .Values.image.registry }}/tap-api:{{ include "egernia.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.tapApi.port }}
          envFrom:
            - configMapRef:
                name: {{ include "egernia.fullname" . }}-config
            - secretRef:
                name: {{ include "egernia.fullname" . }}-db
          volumeMounts:
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp
          # Both probes used to point at /tap/availability, which reports on
          # the database and so queues for a pooled connection. Under load
          # that endpoint cannot answer inside the probe's one-second default,
          # and the liveness probe killed a service that was busy rather than
          # broken — measured, twice, at an offered rate inside the service's
          # own capacity. Liveness now asks only whether the process is
          # turning; readiness still asks about the database, but distinguishes
          # a full pool from an unreachable one.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            # Explicit rather than inherited: the default is one second, and a
            # probe whose timeout is shorter than a GC pause restarts healthy
            # processes.
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.tapApi.resources | nindent 12 }}
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: {{ include "egernia.fullname" . }}-results
        - name: tmp
          emptyDir: {}
