{{- /*
Vertical autoscaling of the service pods (roadmap package 5). Requires the
VerticalPodAutoscaler CRDs (https://github.com/kubernetes/autoscaler) in the
cluster, so it is off by default. Start in recommendation mode (updateMode
"Off"), read the recommendations from `kubectl describe vpa`, then switch to
"Auto" once the bounds below are trusted.
*/}}
{{- if .Values.verticalAutoscaling.enabled }}
{{- range $component, $spec := dict "tap-api" .Values.verticalAutoscaling.tapApi "tap-executor" .Values.verticalAutoscaling.tapExecutor }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: {{ include "egernia.fullname" $ }}-{{ $component }}
  labels:
    {{- include "egernia.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "egernia.fullname" $ }}-{{ $component }}
  updatePolicy:
    updateMode: {{ $.Values.verticalAutoscaling.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
      - containerName: {{ $component }}
        minAllowed:
          {{- toYaml $spec.minAllowed | nindent 10 }}
        maxAllowed:
          {{- toYaml $spec.maxAllowed | nindent 10 }}
        controlledResources: {{ toJson $.Values.verticalAutoscaling.controlledResources }}
---
{{- end }}
{{- end }}
