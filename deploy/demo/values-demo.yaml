# Values for the multi-machine demo: the service on a Kubernetes cluster, the
# notebook on someone else's laptop.
#
# Two things separate this from the defaults. Everything the notebook needs is
# reachable from outside the cluster — the TAP endpoints, the JSON API and
# Prometheus — because a demo where the audience has to `kubectl port-forward`
# is a demo about kubectl. And the API is allowed to scale, because "it scales"
# is the claim being demonstrated and an HPA that never fires demonstrates
# nothing.
#
# Sized for the ~100 GiB D5 dataset. Everything here is a starting point to be
# checked against the cluster it lands on: `storageClass` and the ingress
# `className` in particular have no portable default, which is why they are
# empty and the Makefile refuses to guess them.
#
# Reached over an SSH tunnel to one ingress port. On the laptop:
#
#   echo '127.0.0.1 egernia.test' | sudo tee -a /etc/hosts
#   make demo-tunnel HOST=cluster-host
#   open http://egernia.test:8080/tap/capabilities
#
# One forwarded port carries /tap, /api/v1 and /prometheus, because the
# ingress routes by path. It routes by *Host* as well, which is the reason
# for the /etc/hosts line: the name has to be in the request, not just in
# the URL bar. `make demo-tunnel` prints both lines.

image:
  registry: ghcr.io/ska-telescope/egernia
  tag: latest
  pullPolicy: Always

ingress:
  enabled: true
  # -- The name the notebook machine maps to 127.0.0.1. `.test` is reserved
  # by RFC 6761 for exactly this: it can never collide with a real domain.
  host: egernia.test
  # -- So the /etc/hosts line stays a convenience rather than a prerequisite:
  # a colleague who only forwards a port reaches the service as `localhost`,
  # and gets job URLs naming `localhost` back.
  extraHosts:
    - localhost
  # -- and the same for anyone who types the IP instead. Safe here because
  # the demo cluster's ingress controller serves nothing else.
  catchAll: true
  # -- REQUIRED on most clusters: nginx, traefik, alb... An empty className
  # means "the cluster default", which many clusters do not define.
  className: ""
  annotations: {}
  # TLS is off by default and that is not laziness: the tunnel is already an
  # encrypted channel, so a certificate inside it protects nothing and costs
  # a trust decision on every laptop. `make demo-tls` turns it on with a
  # self-signed certificate for the host above, for anyone who wants the
  # padlock in the screenshot.
  tls: []
  # Prometheus has no authentication of its own. Acceptable here because the
  # only way in is an SSH tunnel to a cluster you can already reach; not
  # acceptable on a public ingress, which is why the chart defaults it off.
  exposePrometheus: true

tapApi:
  # ClusterIP: the ingress is the way in. NodePort stays available in the
  # chart for a cluster with no ingress controller — see deploy/demo/README.
  service:
    type: ClusterIP
  # -- REQUIRED, and easy to miss. Every UWS job URL, every result link and
  # the accessURL in the capabilities document are built from this. Left
  # unset it defaults to the in-cluster service, so a job created through the
  # tunnel hands back a Location the notebook machine cannot resolve — which
  # is a broken async demo that looks like a network fault.
  # Must match the URL the notebook uses, port included.
  baseUrl: "http://egernia.test:8080/tap"
  replicas: 2
  # One worker per core of the CPU limit, no higher: ADQL translation is
  # pure-Python and holds the GIL, so a worker cannot exceed one core whatever
  # the cgroup allows.
  workers: 4
  limitConcurrency: 64
  resources:
    requests:
      cpu: "2"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 4Gi

tapExecutor:
  replicas: 2
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi

# The demo's headline: more pods when there is more work. CPU is the honest
# signal for the API — its work is pure-Python translation and serialization.
horizontalAutoscaling:
  tapApi:
    enabled: true
    minReplicas: 2
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70
    behavior:
      scaleDown:
        # Slower than the 5-minute default: an audience watching a dashboard
        # should see the fleet come back down, not blink and miss it.
        stabilizationWindowSeconds: 60
  tapExecutor:
    enabled: false

prometheus:
  enabled: true
  # 2s rather than the 15s default: a scale-out that completes in twenty
  # seconds is four points at 15s, which is not a curve anyone can read from
  # the back of a room.
  scrapeInterval: 2s
  retention: 6h

postgresql:
  enabled: true
  # ~100 GiB of data, plus indexes, plus room for the WAL and a vacuum.
  storage: 200Gi
  storageClass: ""
  # Sized for the resources below. shared_buffers at a quarter of the memory
  # limit is the usual starting point; effective_cache_size tells the planner
  # what the OS is likely holding on top of that.
  tuning:
    # The chart refuses to install if the fleet could open more connections
    # than this, fully scaled out, and it is right to: the arithmetic is
    # `maxReplicas x workers x dbPoolMax` plus the executors, which at 12 x 4
    # x 6 + 2 x 6 is 300 against the 497 usable here (PostgreSQL reserves 3
    # for superusers). Raise this and dbPoolMax together, or not at all.
    max_connections: "500"
    shared_buffers: "8GB"
    effective_cache_size: "24GB"
    work_mem: "64MB"
    maintenance_work_mem: "2GB"
    # Scan-heavy ADQL (the full-table aggregates the demo deliberately shows
    # as *not* sub-second) can take parallel workers. Track the CPU limit.
    max_parallel_workers: "8"
    max_parallel_workers_per_gather: "4"
    random_page_cost: "1.1"  # SSD-backed PVC, not a spinning disk
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "8"
      memory: 32Gi

results:
  size: 20Gi
  storageClass: ""

config:
  # Per worker process. See the connection arithmetic under postgresql.tuning:
  # this is the number the fleet's peak is multiplied by.
  dbPoolMax: 6
  # A demo asks for large results on purpose; the default 10k row cap would
  # make every "huge query" a truncated one.
  defaultMaxrec: 100000
  hardMaxrec: 5000000
  syncTimeoutSeconds: 120
