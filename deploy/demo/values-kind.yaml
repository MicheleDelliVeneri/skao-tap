# Overlay for running the demo on a single-node cluster (kind, minikube, k3s),
# layered over values-demo.yaml:
#
#   helm upgrade --install ... -f values-demo.yaml -f values-kind.yaml
#
# The demo values are sized for a real cluster, where 12 API pods at 2 CPU
# each is 24 cores spread over several machines. On one node that is a
# scheduling wall rather than a demonstration: pods sit Pending and the
# "it scales" story stops at whatever fits. Everything here is smaller so the
# whole ladder actually runs, and the dataset target is smaller so it can be
# generated in minutes rather than hours.

tapApi:
  replicas: 2
  workers: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi

tapExecutor:
  replicas: 1
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

horizontalAutoscaling:
  tapApi:
    enabled: true
    minReplicas: 2
    # Six at 500m requested is three cores — room to see the fleet grow and
    # shrink on a laptop-sized node without anything going Pending.
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 60

postgresql:
  storage: 40Gi
  tuning:
    # 6 API pods x 2 workers x pool 6, plus the executor, is 84 — well inside
    # this. The chart refuses to install if the arithmetic does not hold.
    max_connections: "200"
    shared_buffers: "2GB"
    effective_cache_size: "6GB"
    work_mem: "32MB"
    maintenance_work_mem: "512MB"
    max_parallel_workers: "4"
    max_parallel_workers_per_gather: "2"
    random_page_cost: "1.1"
  resources:
    requests:
      cpu: "1"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi

results:
  size: 5Gi

config:
  dbPoolMax: 6
